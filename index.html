<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O‘quv Markaz CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="O‘quv markazlari uchun CRM: o‘quvchilar, guruhlar, davomat, to‘lovlar, qarzdorlar va hisobotlar. 14 kun bepul.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563EB'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EOM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* =====================================================================
   DIZAYN TOKENLARI
   Layout: mobil — bitta ustun + pastki navigatsiya;
           ≥960px — chap menyu + kartalar to‘ri.
   Asosiy rang (--primary) JavaScript'dagi SOZLAMALAR.asosiyRang'dan olinadi.
   ===================================================================== */
:root {
  --primary: #2563EB;
  --on-primary: #FFFFFF;
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --surface-2: #F4F7FB;
  --line: #E1E7F0;
  --text: #0F1B2D;
  --muted: #56667D;
  --ok: #047857;
  --bad: #C81E1E;
  --warn: #B45309;
  --danger-bg: #C81E1E;
  --primary-ink: var(--primary);
  --primary-soft: color-mix(in srgb, var(--primary) 11%, var(--surface));
  --primary-mid: color-mix(in srgb, var(--primary) 40%, var(--surface));
  --ok-soft: color-mix(in srgb, var(--ok) 12%, var(--surface));
  --bad-soft: color-mix(in srgb, var(--bad) 10%, var(--surface));
  --warn-soft: color-mix(in srgb, var(--warn) 12%, var(--surface));
  --shadow: 0 1px 2px rgb(16 30 60 / .05), 0 12px 32px -14px rgb(16 30 60 / .16);
  --r-lg: 22px;
  --r: 16px;
  --r-sm: 12px;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-display: "Unbounded", "Onest", "Segoe UI", system-ui, sans-serif;
  --nav-h: 70px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1120; --surface: #121B2C; --surface-2: #19243A; --line: #24314A;
    --text: #E7EDF7; --muted: #97A5BC; --ok: #34D399; --bad: #F87171; --warn: #FBBF24;
    --primary-ink: color-mix(in srgb, var(--primary) 55%, #FFFFFF);
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 12px 32px -16px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1120; --surface: #121B2C; --surface-2: #19243A; --line: #24314A;
  --text: #E7EDF7; --muted: #97A5BC; --ok: #34D399; --bad: #F87171; --warn: #FBBF24;
  --primary-ink: color-mix(in srgb, var(--primary) 55%, #FFFFFF);
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 12px 32px -16px rgb(0 0 0 / .7);
  color-scheme: dark;
}

/* ---------- Asos ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
body.modal-open { overflow: hidden; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--primary-ink); }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.qizil { color: var(--bad); }
.yashil { color: var(--ok); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.raqam, .summa { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent); outline-offset: 2px; }

/* ---------- Karkas ---------- */
.ilova { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.yon { display: none; }
.asosiy { min-width: 0; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-ich { display: flex; align-items: center; gap: 12px; width: 100%; }
.brend { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.logo {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: grid; place-items: center;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .03em;
}
.logo.katta { width: 64px; height: 64px; border-radius: 20px; font-size: 20px; }
.markaz { font-size: 12.5px; color: var(--muted); font-weight: 500; overflow-wrap: anywhere; }
.sarlavha { font-family: var(--f-display); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.top-amal { display: flex; align-items: center; gap: 8px; }
.demo-chip {
  border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
  padding: 6px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn);
  letter-spacing: .04em; text-transform: uppercase;
}
.main {
  display: flex; flex-direction: column; gap: 16px; width: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
}
.main:focus { outline: none; }
.bolim { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Pastki navigatsiya (mobil) */
.pastki {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -10px 30px -18px rgb(10 20 40 / .35);
  padding-top: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-b {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px;
  justify-content: center; text-decoration: none; color: var(--muted);
  font-size: 11.5px; font-weight: 600;
}
.nav-b .ic-joy { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
.nav-b[aria-current="page"] { color: var(--primary-ink); }
.nav-b[aria-current="page"] .ic-joy { background: var(--primary-soft); }

/* Chap menyu (kompyuter) */
@media (min-width: 960px) {
  .ilova { grid-template-columns: 252px minmax(0, 1fr); }
  .yon {
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh; overflow: auto;
    background: var(--surface); border-right: 1px solid var(--line);
    padding-block: 20px; padding-right: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
  }
  .yon-brend { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }
  .yon-brend b { font-family: var(--f-display); font-weight: 600; font-size: 14px; line-height: 1.25; }
  .yon a {
    display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px;
    border-radius: 14px; color: var(--muted); text-decoration: none; font-weight: 600;
  }
  .yon a:hover { background: var(--surface-2); color: var(--text); }
  .yon a[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); }
  .top .logo, .top .markaz { display: none; }
  .top { padding-left: 32px; padding-right: 32px; padding-block: 18px 14px; }
  .sarlavha { font-size: 24px; }
  .main { padding-left: 32px; padding-right: 32px; padding-bottom: 48px; }
  .pastki { display: none; }
}

/* ---------- Tugmalar ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid transparent;
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none;
  background: var(--surface-2); color: var(--text); transition: transform .08s, background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, #000000); }
.btn-soft { background: var(--primary-soft); color: var(--primary-ink); }
.btn-soft:hover { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger-bg); color: #FFFFFF; }
.btn-qizil-matn { color: var(--bad); }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn-blok { width: 100%; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; flex: none;
  border-radius: 14px; border: 0; background: var(--surface); color: var(--text);
  cursor: pointer; box-shadow: var(--shadow);
}
.icon-btn.tekis { box-shadow: none; background: transparent; color: var(--muted); }
.icon-btn.tekis:hover { background: var(--surface-2); color: var(--text); }
.link { font-weight: 600; text-decoration: none; font-size: 14px; }

/* ---------- Kartalar ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-h h2 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.b-bosh { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.b-bosh p { margin: 0; color: var(--muted); font-weight: 500; }
.ikki-ustun { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 900px) { .ikki-ustun { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.kartalar.yuqori { align-items: start; }
/* Keng ekran: bosh sahifada diagramma chapda, raqamlar o‘ngda */
.bosh-yuqori { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1200px) {
  .bosh-yuqori { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); align-items: stretch; }
  .bosh-yuqori .tilelar { grid-template-columns: minmax(0, 1fr); align-content: stretch; }
  .bosh-yuqori .tile { justify-content: center; }
  .hero .d-ich { height: 250px !important; }
}
.kartalar { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 14px; }

/* Bosh sahifa */
.hero .katta-son {
  font-size: clamp(30px, 8.5vw, 42px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05;
  font-variant-numeric: tabular-nums; margin: 4px 0 6px; overflow-wrap: anywhere;
}
.katta-son small, .tile-v small { white-space: nowrap; font-size: .45em; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.tilelar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;
  background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); min-width: 0;
}
.tile.keng { grid-column: 1 / -1; }
@media (min-width: 760px) { .tilelar { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tile.keng { grid-column: auto; } }
.tile-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); }
.tile-ic.bad { background: var(--bad-soft); color: var(--bad); }
.tile-ic.warn { background: var(--warn-soft); color: var(--warn); }
.tile-l { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile-v { font-size: clamp(22px, 6vw, 30px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
.tile-s { font-size: 12.5px; color: var(--muted); }

.xush { display: flex; flex-direction: column; gap: 14px; padding: 26px 20px; }
.xush h2 { font-family: var(--f-display); font-size: 24px; font-weight: 600; margin: 4px 0 0; }
.xush p { margin: 0; max-width: 60ch; }
.qadamlar { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.qadamlar li::marker { color: var(--primary-ink); font-weight: 700; }
.xush-amal { display: flex; gap: 10px; flex-wrap: wrap; }

/* Ro‘yxat qatorlari */
.royxat { display: flex; flex-direction: column; }
.qator { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.qator:first-child { border-top: 0; }
.qator-btn {
  flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 48px;
  background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
}
.avatar {
  flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; background: var(--primary-soft); color: var(--primary-ink);
}
.q-mat { flex: 1; min-width: 0; }
.q-nom { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.q-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.q-ong { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; flex: none; }
.q-ong b { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Pill / chip */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.primary { background: var(--primary-soft); color: var(--primary-ink); }
.chiplar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; min-width: 0; }
.chiplar::-webkit-scrollbar { display: none; }
.chiplar.orala { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip .son { font-size: 12px; opacity: .75; }

/* Segment (bir nechta tanlovdan biri) */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; border: 1px solid var(--line); min-width: 0; }
.seg > * { flex: 1 1 0; min-width: 0; }
.seg button, .seg label > span {
  min-height: 42px; width: 100%; border-radius: 10px; border: 0; background: transparent;
  font: inherit; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0 8px; text-align: center;
}
.seg label { position: relative; display: flex; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg [aria-pressed="true"], .seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent); }

/* ---------- Formalar ---------- */
.forma { display: flex; flex-direction: column; gap: 14px; }
.maydon { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.maydon > span, .maydon > legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 6px; }
.maydon > span { margin-bottom: 0; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  min-height: 48px; padding: 10px 14px; width: 100%; min-width: 0;
}
textarea { min-height: 112px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
.ikki { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 380px) { .ikki { grid-template-columns: minmax(0, 1fr); } }
.xato { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 14px; }
.qidiruv { position: relative; }
.qidiruv .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.qidiruv input { padding-left: 44px; }
.asboblar { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .asboblar { grid-template-columns: minmax(0, 1fr) 220px 300px; } }
.kun-tanlov { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.kun-chk { position: relative; display: flex; }
.kun-chk input { position: absolute; opacity: 0; pointer-events: none; }
.kun-chk span {
  width: 100%; min-height: 44px; display: grid; place-items: center; border-radius: 12px;
  border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; background: var(--surface);
}
.kun-chk input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.kun-chk input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent); }
.info-quti { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.iq-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.sana-qator { display: flex; gap: 8px; align-items: center; }
.sana-qator input { flex: 1; }

/* Guruh kartasi */
.guruh-k { display: flex; flex-direction: column; gap: 10px; }
.gk-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.gk-top h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
.narx { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.narx small { color: var(--muted); font-weight: 500; }
.kunlar { display: flex; gap: 6px; flex-wrap: wrap; }
.kun { min-width: 34px; height: 30px; padding: 0 6px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.kun.on { background: var(--primary-soft); color: var(--primary-ink); }
.gk-pas { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }

/* Davomat */
.dav-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.xulosa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.xulosa div { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; }
.xulosa b { font-size: 20px; font-variant-numeric: tabular-nums; }
.xulosa span { font-size: 12px; color: var(--muted); font-weight: 600; }
.xulosa .k b { color: var(--ok); } .xulosa .m b { color: var(--bad); } .xulosa .s b { color: var(--warn); }
.dav-qator { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.dav-qator:first-child { border-top: 0; }
.dq-ism { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.dav-tugmalar { flex: 1 1 340px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mark {
  min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; padding: 0 4px;
}
.mark[data-v="keldi"][aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.mark[data-v="kelmadi"][aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.mark[data-v="kechikdi"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.mark[data-v="sababli"][aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }
.saqla-bar {
  position: sticky; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 10px 10px 10px 16px; box-shadow: 0 14px 34px -12px rgb(10 20 40 / .4);
}
.saqla-bar .holat { flex: 1; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.saqla-bar.ozgardi .holat { color: var(--warn); font-weight: 700; }
@media (min-width: 960px) { .saqla-bar { bottom: 16px; } }

/* Qarzdorlar */
.qarz-k { display: flex; flex-direction: column; gap: 12px; }
.qk-top { display: flex; align-items: flex-start; gap: 12px; }
.qk-summa { font-weight: 700; font-size: 17px; color: var(--bad); white-space: nowrap; font-variant-numeric: tabular-nums; }
.qk-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.qk-amal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.qk-amal .btn { white-space: normal; text-align: center; line-height: 1.2; }
.jami-qator { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.jami-qator .katta { font-size: 26px; font-weight: 700; color: var(--bad); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* Xabarlar */
.xabar-k { display: flex; flex-direction: column; gap: 10px; }
.tel { font-size: 14px; color: var(--muted); }
.tel b { color: var(--text); user-select: all; font-variant-numeric: tabular-nums; }
.xk-amal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.fokus { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--primary-soft); color: var(--primary-ink); border-radius: 14px; padding: 8px 8px 8px 14px; font-weight: 600; }

/* Diagramma */
.diagramma { --ax: 46px; margin-top: 8px; }
.d-ich { position: relative; margin-left: var(--ax); margin-top: 34px; }
.d-chiziq { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.d-chiziq span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-ustunlar { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
.d-joy { position: relative; height: 100%; }
.d-fon, .d-bar { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(42px, 80%); border-radius: 999px 999px 8px 8px; }
.d-fon { background: var(--primary-soft); border: 1.5px dashed var(--primary-mid); }
.d-bar { background: var(--primary-mid); }
.d-ustun.tanlangan .d-bar { background: var(--primary); }
.d-teg {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--surface); font-size: 12px; font-weight: 700;
  padding: 4px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.d-yorliqlar { margin-left: var(--ax); display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.d-yorliq { text-align: center; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.d-yorliq.tanlangan { color: var(--primary-ink); font-weight: 700; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.legend .l-fon { background: var(--primary-soft); border: 1.5px dashed var(--primary-mid); }
.legend .l-bar { background: var(--primary); }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; flex: 1; }
.progress > div { height: 100%; background: var(--primary); border-radius: inherit; }
.g-hisobot { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.g-hisobot:first-child { border-top: 0; }
.gh-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hb { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.hb .hb-l { width: 74px; color: var(--muted); font-weight: 600; flex: none; }
.hb b { width: 44px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.hb .progress.ok > div { background: var(--ok); }
.oy-nav { display: flex; align-items: center; gap: 8px; }
.oy-nav b { flex: 1; text-align: center; font-size: 16px; }

/* Menyu */
.menyu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.menyu-k { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.menyu-k b { font-size: 15px; }
.menyu-k span.muted { font-size: 12.5px; }

/* Ma’lumotlar */
.amal-qator { display: flex; gap: 10px; flex-wrap: wrap; }
details.yordam { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; }
details.yordam summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details.yordam[open] { display: flex; flex-direction: column; gap: 10px; }
.kod { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; }

/* Bo‘sh holat */
.bosh-holat { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bh-ic { width: 64px; height: 64px; border-radius: 20px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; }
.bosh-holat h3 { margin: 6px 0 0; font-size: 18px; }
.bosh-holat p { margin: 0 0 6px; color: var(--muted); max-width: 40ch; }
.bosh-matn { color: var(--muted); margin: 4px 0; }

/* Ogohlantirish banneri */
.banner {
  display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 16px;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); font-size: 14px;
}
.banner > .ic { color: var(--warn); }
.banner .b-mat { flex: 1 1 220px; min-width: 0; }
.banner.xavf { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.banner.xavf > .ic { color: var(--bad); }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal-fon { position: absolute; inset: 0; background: rgb(6 12 26 / .5); opacity: 0; transition: opacity .2s; }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding-top: 22px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  transform: translateY(24px); opacity: 0; transition: transform .22s, opacity .22s;
}
.modal.korin .modal-fon { opacity: 1; }
.modal.korin .sheet { transform: none; opacity: 1; }
.sheet-h { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
.sheet-p { margin: 0 0 16px; color: var(--muted); }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.sheet-actions .btn { flex: 1 1 140px; }
.sheet-actions .chap { margin-right: auto; flex: 0 1 auto; }
@media (min-width: 640px) { .modal { align-items: center; padding: 24px; } .sheet { border-radius: 24px; } }

/* Toast */
.toast-joy { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
@media (min-width: 960px) { .toast-joy { bottom: 28px; } }
.toast { display: flex; align-items: center; gap: 8px; background: var(--text); color: var(--surface); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px -10px rgb(0 0 0 / .4); animation: chiq .2s ease-out; }
@keyframes chiq { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* =====================================================================
   CRM QO‘SHIMCHALARI (v2)
   ===================================================================== */
.pastki { grid-template-columns: repeat(var(--nav-n, 5), minmax(0, 1fr)); }
.ok-matn { color: var(--ok); }
.warn-matn { color: var(--warn); }
.nowrap { white-space: nowrap; }
.mt0 { margin-top: 0; }
.qator-orasi { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.uch { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 560px) { .uch { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Chap menyu guruh sarlavhalari */
.yon-sar { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 4px; }
.yon-pas { margin-top: auto; padding-top: 16px; }

/* Foydalanuvchi chipi */
.men-chip {
  display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer; font: inherit;
  background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 4px 10px 4px 4px; min-height: 44px; color: var(--text);
}
.men-chip .avatar { width: 36px; height: 36px; border-radius: 11px; font-size: 13px; }
.men-chip .mc-mat { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }
.men-chip .mc-mat b { font-size: 13.5px; }
.men-chip .mc-mat span { font-size: 11.5px; color: var(--muted); }
@media (max-width: 560px) { .men-chip .mc-mat { display: none; } .men-chip { padding: 4px; } }

/* ---------- Kirish ekranlari ---------- */
body.kirish-rejim .yon, body.kirish-rejim .pastki, body.kirish-rejim .top { display: none !important; }
body.kirish-rejim .ilova { grid-template-columns: minmax(0, 1fr); }
body.kirish-rejim .main { padding-bottom: 40px; min-height: 100vh; justify-content: center; align-items: center; }
.kirish { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 18px; margin: 24px auto; }
.kirish-bosh { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.kirish-bosh h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; }
.kirish-bosh p { margin: 0; color: var(--muted); }
.kirish .card { padding: 22px; }
.xodim-tanlov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.xodim-b {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px; border-radius: 18px;
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font: inherit; color: var(--text); text-align: center;
}
.xodim-b:hover { border-color: var(--primary); }
.xodim-b .avatar { width: 52px; height: 52px; border-radius: 16px; font-size: 17px; }
.xodim-b b { font-size: 14.5px; overflow-wrap: anywhere; }
.pin-nuqtalar { display: flex; justify-content: center; gap: 14px; margin: 8px 0 4px; }
.pin-nuqtalar i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); display: block; transition: background .12s; }
.pin-nuqtalar i.on { background: var(--primary); border-color: var(--primary); }
.pin-nuqtalar.xato i { border-color: var(--bad); animation: silkin .35s; }
@keyframes silkin { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.pin-pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.pin-pad button {
  min-height: 62px; border-radius: 18px; border: 0; background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 24px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
}
.pin-pad button:active { background: var(--primary-soft); }
.pin-pad button.tekis { background: transparent; font-size: 15px; color: var(--muted); }
.demo-maslahat { background: var(--warn-soft); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; }
.yuklash-ani { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: aylan 0.9s linear infinite; margin: 0 auto; }
@keyframes aylan { to { transform: rotate(360deg); } }

/* ---------- Lidlar ---------- */
.kanban { display: none; }
.lid-mobil { display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 1100px) {
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .lid-mobil { display: none; }
}
.kb-ustun { background: var(--surface-2); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 1px solid var(--line); }
.kb-bosh { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 6px 6px; font-weight: 700; font-size: 14px; }
.kb-bosh .son { font-size: 12px; color: var(--muted); font-weight: 600; }
.lid-k {
  background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 1px 2px rgb(16 30 60 / .06); border: 1px solid var(--line); min-width: 0;
}
.lid-k.kech { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.lid-k .lk-nom { font-weight: 600; overflow-wrap: anywhere; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; text-align: left; color: var(--text); cursor: pointer; }
.lid-k .lk-sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.lid-k .lk-pas { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.st-nuqta { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.st-yangi { background: var(--primary); } .st-boglanildi { background: var(--warn); } .st-sinov { background: #8B5CF6; }
.st-yozildi { background: var(--ok); } .st-rad { background: var(--muted); }

/* ---------- O‘quvchi profili ---------- */
.profil-bosh { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.profil-bosh .avatar { width: 58px; height: 58px; border-radius: 18px; font-size: 19px; }
.profil-bosh h2 { margin: 0; font-size: 20px; }
.balans-k { border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--surface-2); margin-bottom: 14px; }
.balans-k.qarz { background: var(--bad-soft); }
.balans-k.ortiq { background: var(--ok-soft); }
.balans-k b { font-size: 22px; font-variant-numeric: tabular-nums; }
.bo-sar { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
.mini-jadval { width: 100%; border-collapse: collapse; font-size: 14px; }
.mini-jadval td, .mini-jadval th { padding: 8px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.mini-jadval th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
.mini-jadval td.o { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.jadval-oram { overflow-x: auto; }
.keng-jadval { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.keng-jadval th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.keng-jadval td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.keng-jadval td.o, .keng-jadval th.o { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.keng-jadval tr:last-child td { border-bottom: 0; }

/* ---------- Jadval (haftalik) ---------- */
.hafta { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hafta .kun-ustun { display: none; }
.hafta .kun-ustun.tanlangan { display: flex; }
@media (min-width: 1100px) {
  .hafta { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .hafta .kun-ustun { display: flex; }
  .kun-chiplar { display: none !important; }
}
.kun-ustun { flex-direction: column; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 10px; min-width: 0; }
.kun-ustun.bugun { border-color: var(--primary); }
.ku-bosh { font-weight: 700; font-size: 14px; padding: 2px 4px 4px; display: flex; justify-content: space-between; }
.dars-k { background: var(--surface); border-radius: 12px; padding: 10px; border-left: 4px solid var(--primary); display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; }
.dars-k b { font-size: 14px; overflow-wrap: anywhere; }
.dars-k .vaqt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary-ink); }
.dars-k.toqnash { border-left-color: var(--bad); background: var(--bad-soft); }
.bo-sh { color: var(--muted); font-size: 13px; padding: 6px 4px; }

/* ---------- Chek ---------- */
.chek { background: var(--surface-2); border-radius: 16px; padding: 16px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--line); }
.chek .ch-q { display: flex; justify-content: space-between; gap: 10px; }
.chek .ch-q span { color: var(--muted); }
.chek .ch-jami { font-size: 22px; font-weight: 700; text-align: center; padding: 6px 0; font-variant-numeric: tabular-nums; }
.chek .ch-sar { text-align: center; font-weight: 700; }

/* ---------- Juft diagramma ---------- */
.d-juft { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(60px, 90%); height: 100%; display: flex; align-items: flex-end; gap: 4px; }
.d-juft > div { flex: 1; border-radius: 999px 999px 6px 6px; min-height: 0; }
.d-juft .a { background: var(--primary); }
.d-juft .b { background: color-mix(in srgb, var(--warn) 75%, var(--surface)); }
.legend .l-b { background: color-mix(in srgb, var(--warn) 75%, var(--surface)); }

/* Kategoriya chiziqlari */
.kat-q { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 0; }
.kat-q b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.kat-q .progress > div { background: var(--primary); }
.progress.warn > div { background: var(--warn); }
@media (max-width: 420px) { .kat-q { grid-template-columns: 86px minmax(0, 1fr) auto; } }

/* Kod bloki (qoidalar) */
pre.kod-blok { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; font-size: 12px; margin: 0; white-space: pre; }
.qadam-r { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.qadam-r li::marker { font-weight: 700; color: var(--primary-ink); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; min-height: 44px; }
.toggle input { width: 22px; height: 22px; min-height: 0; accent-color: var(--primary); }

/* Hisobot: 6 ta ko‘rsatkich — telefonda 2, kompyuterda 3 ustun */
.tilelar.t6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .tilelar.t6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- v3: statistika, qabulxona, diqqat ---------- */
.nishon { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.menyu-k b { display: flex; align-items: center; gap: 8px; }
.filial-sel { min-height: 40px; padding: 6px 10px; border-radius: 12px; font-size: 14px; max-width: 180px; }
@media (max-width: 560px) { .filial-sel { max-width: 120px; } }
.xulosa.x5 { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.davr-panel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.davr-panel input[type="date"], .davr-panel select { min-height: 40px; padding: 6px 10px; width: auto; }
.davr-panel .orasi { color: var(--muted); }
.tab-chiplar .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.farq { font-size: 12.5px; font-weight: 600; }
.farq.up { color: var(--ok); } .farq.down { color: var(--bad); }
/* Chiziqli grafik */
.chiziq-q { --ax: 56px; }
.chiziq { position: relative; margin: 14px 0 34px var(--ax); }
.chiziq svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chiziq polyline { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.chiziq polygon { stroke: none; opacity: .10; }
.chiziq .nol { position: absolute; left: 0; right: 0; border-top: 1px solid var(--muted); opacity: .4; }
.cx-yorliq { position: absolute; top: calc(100% + 8px); transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.cx-nuqta { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, 50%); border: 2px solid var(--surface); }
.legend .lc { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
/* Halqa (foiz) */
.halqa { --p: 0; width: 132px; height: 132px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-2) 0); }
.halqa > div { width: 104px; height: 104px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; }
.halqa b { font-size: 26px; display: block; }
.halqa span { font-size: 12px; color: var(--muted); }
.dav-kun { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
/* Markaz holati */
.ball { font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.ball.yaxshi { background: var(--ok-soft); color: var(--ok); }
.ball.yomon { background: var(--bad-soft); color: var(--bad); }
.holat-q { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.holat-q:first-of-type { border-top: 0; }
.holat-q .qator-orasi b { font-variant-numeric: tabular-nums; }
/* Ogohlantirishlar */
.ogoh { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.ogoh:first-child { border-top: 0; }
.ogoh-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--warn-soft); color: var(--warn); }

/* Qabulxona jadvali */

.qb-jadval td .q-sub { font-size: 12.5px; }
.qb-jadval tr:hover td { background: var(--surface-2); }
.qb-jadval .ism-btn { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.sahifalash { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }

/* Vazifa */

.belgi-q { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }

/* Telefonda sarlavha siqilib qolmasin */

  .top-amal { gap: 6px; }

}

/* Kirish: parol maydoni va login ma’lumotlari */

/* Tariflar */

<script>
"use strict";

/* =====================================================================
   1. SOZLAMALAR
   Dasturni yangi mijozga yoki boshqa sohaga moslash uchun shu obyektni
   o‘zgartiring. Butun interfeys shu yerdan o‘qiydi.
   ===================================================================== */
const SOZLAMALAR = {
  dasturNomi: "O‘quv Markaz CRM",
  versiya: "1.3.1",              // har yangi versiyada oshiriladi (CHANGELOG.md)
  markazNomi: "Bilim o‘quv markazi",     // dastur ichida «Sozlamalar»dan ham o‘zgartiriladi
  markazTel: "+998 90 000 00 00",
  logoMatni: "OM",
  asosiyRang: "#2563EB",
  valyuta: "so‘m",

  // Soha so‘zlari (kichik harfda). Bog‘cha uchun: oquvchi: "bola", oqituvchi: "tarbiyachi"
  atamalar: {
    oquvchi: "o‘quvchi", oquvchilar: "o‘quvchilar",
    guruh: "guruh", guruhlar: "guruhlar",
    oqituvchi: "o‘qituvchi", oqituvchilar: "o‘qituvchilar",
    otaOna: "ota-ona",
  },

  tolovKuni: 5,                  // oylik to‘lov har oyning shu kunigacha
  proporsional: true,            // oy o‘rtasida qo‘shilsa/ketsa — dars kunlariga qarab hisoblash
  kelmaganDarsYechilsin: false,  // «har dars» guruhlarda «kelmadi» ham pul yechadimi
  yaxlitlash: 1000,              // hisoblangan summalar shu songa yaxlitlanadi
  tolovUsullari: ["Naqd", "Click", "Payme", "Karta"],
  lidManbalari: ["Instagram", "Telegram", "Tanish orqali", "Banner / flayer", "Sayt", "Boshqa"],
  xarajatTurlari: ["Ijara", "Kommunal", "Reklama", "Oylik", "Jihozlar", "Kanselyariya", "Boshqa"],
  zaxiraEslatmaKun: 3,
  parolUrinish: 5,               // shuncha xato paroldan keyin 30 soniya kutish
  sinovKun: 14,                  // ro‘yxatdan o‘tgan markaz uchun bepul sinov, kun

  // Dastur egasi (sotuvchi). Kirish va faollashtirish oynasida ko‘rinadi.
  sotuvchi: { nom: "O‘quv Markaz CRM", tel: "+998 90 841 02 20", telegram: "" },
  // Markazlar serveri (Google Apps Script veb-ilova manzili). Bo‘sh bo‘lsa, ro‘yxat va tekshiruv ishlamaydi.
  server: "https://script.google.com/macros/s/AKfycbxZshxNSq_BtBGPIpcSw9VXBvwhGCeLPrf4T0P6W2O8w_sPSbLNEAPHC2O91DiuXwAE/exec",
  tekshirDaqiqa: 10,             // dastur ochiq turganda holat shuncha daqiqada bir tekshiriladi
  telegramHavola: "https://t.me/share/url?text=",

  // Rollar qaysi bo‘limlarni ko‘radi ("*" = hammasi)
  huquqlar: {
    direktor: "*",
    admin: ["bosh", "oquvchilar", "davomat", "diqqat", "xabarlar", "sorovlar", "lidlar", "kurslar", "guruhlar", "jadval", "vazifalar", "tolov", "qarzdorlar", "kassa", "chegirmalar", "menyu"],
    menejer: ["bosh", "lidlar", "sorovlar", "xabarlar", "oquvchilar", "kurslar", "jadval", "menyu"],
    kassir: ["bosh", "tolov", "qarzdorlar", "kassa", "oquvchilar", "xabarlar", "menyu"],
    oqituvchi: ["bosh", "jadval", "davomat", "vazifalar", "oquvchilar", "menyu"],
  },
  pastkiMenyu: {
    direktor: ["bosh", "oquvchilar", "davomat", "tolov", "menyu"],
    admin: ["bosh", "oquvchilar", "davomat", "tolov", "menyu"],
    menejer: ["bosh", "lidlar", "sorovlar", "oquvchilar", "menyu"],
    kassir: ["bosh", "tolov", "qarzdorlar", "kassa", "menyu"],
    oqituvchi: ["bosh", "jadval", "davomat", "vazifalar", "menyu"],
  },
  sorovTurlari: ["Savol", "Shikoyat", "Taklif", "To‘lov masalasi", "Boshqa"],
  davomatMaqsad: 80,             // shundan past davomatli guruhlar «e’tibor talab» qiladi
  sigimMaqsad: [75, 90],         // guruh to‘lishi uchun maqsad oralig‘i, %

  shablonlar: {
    qarz: "Assalomu alaykum! [markaz]dan bezovta qilyapmiz. [ism]ning to‘lovidan [summa] so‘m qarzdorlik bor ([davr]). Iltimos, to‘lovni imkon qadar tezroq amalga oshiring. Rahmat!",
    kelmadi: "Assalomu alaykum! [ism] [sana] kuni [guruh] darsiga kelmadi. Iltimos, sababini bizga xabar bering. Hurmat bilan, [markaz].",
    tolov: "Assalomu alaykum! [ism] uchun [summa] so‘m to‘lov qabul qilindi ([sana], [usul]). Joriy balans: [balans] so‘m. Rahmat! [markaz]",
    lid: "Assalomu alaykum, [ism]! [markaz]dan yozyapmiz. [kurs] bo‘yicha bepul sinov darsiga taklif qilamiz. Sizga qaysi kun qulay?",
  },

  omborKaliti: "oquv-markaz-crm-v2",
};

/* =====================================================================
   2. YORDAMCHI FUNKSIYALAR
   ===================================================================== */
const T = SOZLAMALAR.atamalar;
const OYLAR = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
const KUNLAR = [
  { k: "Du", n: "Dushanba" }, { k: "Se", n: "Seshanba" }, { k: "Ch", n: "Chorshanba" },
  { k: "Pa", n: "Payshanba" }, { k: "Ju", n: "Juma" }, { k: "Sh", n: "Shanba" }, { k: "Ya", n: "Yakshanba" },
];
const HOLAT_NOMI = { keldi: "Keldi", kechikdi: "Kechikdi", kelmadi: "Kelmadi", sababli: "Sababli" };
const QATNASHDI = h => h === "keldi" || h === "kechikdi";
// Lavozimlar (rol). Har bir lavozim ko‘radigan bo‘limlar SOZLAMALAR.huquqlar da
const ROL_NOMI = { direktor: "Direktor", admin: "Administrator", menejer: "Sotuv menejeri", kassir: "Kassir", oqituvchi: katta(T.oqituvchi) };
const LID_HOLAT = [
  { k: "yangi", n: "Yangi" }, { k: "boglanildi", n: "Bog‘lanildi" }, { k: "sinov", n: "Sinov darsi" },
  { k: "yozildi", n: "Yozildi" }, { k: "rad", n: "Rad etdi" },
];
const OYLIK_TURI = { fiks: "Fiks oylik", foiz: "Foiz", dars: "Har dars uchun" };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function katta(s) { return s ? s.charAt(0).toLocaleUpperCase() + s.slice(1) : ""; }
const yangiId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const boshHarf = ism => String(ism || "?").trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0).toLocaleUpperCase()).join("");
const ismBoyicha = (a, b) => (a.ism || a.nomi || "").localeCompare(b.ism || b.nomi || "");
const sum = (arr, f) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const toza = obj => JSON.parse(JSON.stringify(obj));   // chuqur nusxa

const pad2 = n => String(n).padStart(2, "0");
const sanaStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const bugun = () => sanaStr(new Date());
const joriyOy = () => bugun().slice(0, 7);
const sanaObj = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sanaQosh = (s, n) => { const d = sanaObj(s); d.setDate(d.getDate() + n); return sanaStr(d); };
const kunFarqi = (a, b) => Math.round((sanaObj(b) - sanaObj(a)) / 864e5);
const oyQosh = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const oylarOraligi = (a, b) => { const r = []; let x = a; while (x <= b && r.length < 240) { r.push(x); x = oyQosh(x, 1); } return r; };
const oyOxiri = ym => { const [y, m] = ym.split("-").map(Number); return sanaStr(new Date(y, m, 0)); };
const oyNomi = ym => `${OYLAR[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const oyFaqat = ym => OYLAR[+ym.slice(5, 7) - 1];
const oyQisqa = ym => OYLAR[+ym.slice(5, 7) - 1].slice(0, 3);
const hafta = s => (sanaObj(s).getDay() + 6) % 7;
const sanaMatn = s => {
  if (!s) return "—";
  const [y, m, d] = s.split("-").map(Number);
  const t = `${d}-${OYLAR[m - 1].toLowerCase()}`;
  return y === new Date().getFullYear() ? t : `${t} ${y}`;
};
const pul = (n, sep = " ") => (n < 0 ? "−" : "") + Math.round(Math.abs(+n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, sep);
const pulS = n => `${pul(n)} ${SOZLAMALAR.valyuta}`;
const raqam = s => +String(s ?? "").replace(/\D/g, "") || 0;
const yaxlit = n => { const y = SOZLAMALAR.yaxlitlash || 1; return Math.round(n / y) * y; };
const qisqaPul = n => {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e6) return s + String(Math.round(a / 1e4) / 100).replace(".", ",") + " mln";
  if (a >= 1e3) return s + Math.round(a / 1e3) + " ming";
  return s + String(Math.round(a));
};
const yaxshiMax = v => { const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };
const vaqtMin = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + (m || 0); };

// PIN xeshi (SHA-256; eski brauzerlarda oddiy xesh)
async function pinXesh(pin) {
  const matn = "oquv-crm:" + pin;
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(matn));
    return "sha:" + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 2166136261; for (const c of matn) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    return "fnv:" + (h >>> 0).toString(16);
  }
}

/* ---------- Login, parol, litsenziya ---------- */
const lotin = s => String(s || "").toLowerCase().replace(/[‘’'`ʻʼ]/g, "").replace(/[^a-z0-9]/g, "");
// Login avtomatik tuziladi: markaz nomining birinchi so‘zi + xodim ismi (bilim.dilnoza, bilim.dilnoza2 ...)
function loginYasa(ism, id = "", db = DB) {
  const markaz = (db.sozlamalar && db.sozlamalar.markazNomi) || SOZLAMALAR.markazNomi;
  const bosh = lotin(markaz.split(/\s+/)[0]).slice(0, 10) || "markaz", nom = lotin(String(ism || "").split(/\s+/)[0]).slice(0, 12) || "xodim";
  let l = `${bosh}.${nom}`, n = 2;
  while (db.xodimlar.some(x => x.login === l && x.id !== id)) l = `${bosh}.${nom}${n++}`;
  return l;
}
const parolYasa = () => { const a = new Uint32Array(8); try { crypto.getRandomValues(a); } catch (e) { a.forEach((_, i) => { a[i] = Math.random() * 1e9; }); } return [...a].map(x => x % 10).join("").replace(/^0/, "7"); };
const parolTogri = p => /^\d{8}$/.test(p);               // xodim paroli: 8 xonali raqam
const loginTogri = l => /^[a-z0-9][a-z0-9._-]{2,29}$/.test(l);  // kichik lotin harf, raqam, . _ -
// Markaz obunasi: ma’lumotni server beradi (holat, sinov va obuna muddati, server sanasi)
function litsenziyaHolati() {
  const L = DB.litsenziya || {}, tugash = [L.sinovTugash, L.tugash].filter(Boolean).sort().pop() || "";
  if (!L.royxat) return { tur: "yoq", tugagan: false, qoldi: null, tugash: "" };
  const qoldi = tugash ? kunFarqi(serverBugun(), tugash) : -1;
  const tur = L.holat === "bloklangan" ? "bloklangan" : L.tugash && L.tugash >= (L.sinovTugash || "") ? "faol" : "sinov";
  return { tur, tugash, qoldi, tugagan: qoldi < 0, bloklangan: L.holat === "bloklangan" };
}

/* =====================================================================
   3. MA’LUMOTLAR OMBORI
   Serversiz, oflayn: hamma narsa shu brauzerning xotirasida (localStorage).
   Boshqa qurilmaga zaxira fayli orqali ko‘chiriladi.
   Dastur faqat Ombor.yoz / ochir / davomatYoz / sozYoz orqali yozadi.
   ===================================================================== */
const KOLLEKSIYALAR = ["xodimlar", "oqituvchilar", "xonalar", "guruhlar", "oquvchilar", "tolovlar", "lidlar", "xarajatlar",
  "filiallar", "kurslar", "mavsumlar", "chegirmalar", "vazifalar", "sorovlar"];

function boshDB() {
  return {
    versiya: 3,
    sozlamalar: { markazNomi: "", markazTel: "", manzil: "" },
    xodimlar: [],      // {id, ism, rol (lavozim), login, pinXesh (parol xeshi), oqituvchiId, filialId, faol}
    litsenziya: { royxat: "", sinovTugash: "", tugash: "", malumot: {}, markazId: "", token: "", holat: "faol", xabar: "" },   // server bilan bog‘lanish
    oqituvchilar: [],  // {id, ism, tel, fan, oylikTuri, stavka, foizAsosi, izoh, faol}
    xonalar: [],       // {id, nomi, sigim}
    guruhlar: [],      // {id, nomi, fan, oqituvchiId, xonaId, kunlar, boshlanish, tugash, narxTuri, narx, holat, ochilgan}
    oquvchilar: [],    // {id, ism, tel, otaTel, tugilgan, manba, izoh, yaratildi, azolik:[{guruhId, qoshilgan, chiqqan, chegirma}]}

    bekorlar: {},      // {"guruhId|YYYY-MM-DD": "sabab"} — bekor qilingan darslar

  };
}

// Har qanday zaxirani (v1 ham) v2 ko‘rinishiga keltiradi
function tartibla(x) {
  const b = boshDB();
  if (!x || typeof x !== "object") return b;
  const arr = k => (Array.isArray(x[k]) ? x[k] : []);
  const db = {
    ...b,
    sozlamalar: { ...b.sozlamalar, ...(x.sozlamalar || {}) },
    davomat: x.davomat && typeof x.davomat === "object" ? x.davomat : {},
    bekorlar: x.bekorlar && typeof x.bekorlar === "object" ? x.bekorlar : {},
    litsenziya: { ...b.litsenziya, ...(x.litsenziya || {}) },
    shablonlar: { ...b.shablonlar, ...(x.shablonlar || {}) },
    meta: { ...b.meta, ...(x.meta || {}) },
    versiya: 3,
  };
  KOLLEKSIYALAR.forEach(k => { db[k] = arr(k); });
  if (!x.versiya || x.versiya < 2) {
    // v1 → v2: guruh narxi oylik, o‘quvchi bitta guruhda, to‘lov «oy» maydoni izohga
    db.guruhlar = db.guruhlar.map(g => ({ fan: "", oqituvchiId: "", xonaId: "", boshlanish: g.vaqt || "", tugash: "", narxTuri: "oylik", holat: "faol", ochilgan: "", ...g, oqituvchiNomi: g.oqituvchi || "" }));
    db.oquvchilar = db.oquvchilar.map(o => ({
      id: o.id, ism: o.ism, tel: o.tel || "", otaTel: o.otaTel || "", tugilgan: "", manba: "", izoh: "", yaratildi: Date.now(),
      azolik: o.guruhId ? [{ guruhId: o.guruhId, qoshilgan: o.qoshilgan || bugun(), chiqqan: o.holat === "toxtagan" ? (o.toxtaganSana || bugun()) : "", chegirma: 0 }] : [],
    }));
    db.tolovlar = db.tolovlar.map(t => ({ guruhId: "", xodimId: "", ...t, izoh: [t.oy ? oyNomi(t.oy) + " uchun" : "", t.izoh || ""].filter(Boolean).join(". ") }));
  }
  db.oquvchilar.forEach(o => { if (!Array.isArray(o.azolik)) o.azolik = []; });
  // Eski versiyadan: loginsiz xodimlarga login, kodsiz markazga kod va 14 kunlik sinov
  db.xodimlar.forEach(x => { if (!x.login) x.login = loginYasa(x.ism, x.id, db); });
  if (db.xodimlar.length && !db.litsenziya.royxat) {
    db.litsenziya.royxat = bugun();
    db.litsenziya.sinovTugash = sanaQosh(bugun(), SOZLAMALAR.sinovKun);
  }
  return db;
}

const Mahalliy = {

  qoy(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },

/* =====================================================================
   4. HISOB-KITOB (balans, qarz, oylik, statistika)
   Hamma natijalar DBver bo‘yicha keshlanadi — ma’lumot o‘zgarsa qayta hisoblanadi.
   ===================================================================== */
const Kesh = {
  ver: -1, kun: "", fil: "", m: new Map(),
  ol(k, fn) {
    const b = bugun(), f = (typeof UI === "object" ? UI.filial : "") + "|" + (typeof Sessiya === "object" ? Sessiya.xodimId : "");
    if (this.ver !== DBver || this.kun !== b || this.fil !== f) { this.m.clear(); this.ver = DBver; this.kun = b; this.fil = f; }
    if (!this.m.has(k)) this.m.set(k, fn());
    return this.m.get(k);
  },
};
const byId = kol => Kesh.ol("id:" + kol, () => new Map(DB[kol].map(x => [x.id, x])));
const guruh = id => byId("guruhlar").get(id);
const oquvchi = id => byId("oquvchilar").get(id);
const oqituvchi = id => byId("oqituvchilar").get(id);
const xona = id => byId("xonalar").get(id);
const xodim = id => byId("xodimlar").get(id);
const markazNomi = () => DB.sozlamalar.markazNomi || SOZLAMALAR.markazNomi;
const markazTel = () => DB.sozlamalar.markazTel || SOZLAMALAR.markazTel;

const azolikFaol = (a, s) => a.qoshilgan && a.qoshilgan <= s && (!a.chiqqan || a.chiqqan > s);
const faolAzoliklar = (o, s = bugun()) => (o.azolik || []).filter(a => azolikFaol(a, s));
const oquvchiFaol = o => faolAzoliklar(o).length > 0 || (o.azolik || []).some(a => a.qoshilgan > bugun() && !a.chiqqan);
const guruhOquvchilari = (gid, s = bugun()) => DB.oquvchilar.filter(o => (o.azolik || []).some(a => a.guruhId === gid && azolikFaol(a, s))).sort(ismBoyicha);
const oqituvchiNomi = g => (g && (oqituvchi(g.oqituvchiId) || {}).ism) || (g && g.oqituvchiNomi) || "";
const guruhNarxMatn = g => `${pulS(g.narx)} / ${g.narxTuri === "dars" ? "dars" : "oy"}`;

// Guruhning oydagi dars kunlari
function darsKunlari(g, ym) {
  const kunlar = new Set(g.kunlar || []), r = [];
  const oxir = +oyOxiri(ym).slice(8);
  for (let d = 1; d <= oxir; d++) { const s = `${ym}-${pad2(d)}`; if (kunlar.has(KUNLAR[hafta(s)].k)) r.push(s); }
  return r;
}
// Davomat guruh bo‘yicha indekslangan
const davomatIndeks = () => Kesh.ol("davIdx", () => {
  const m = new Map();
  for (const [k, v] of Object.entries(DB.davomat)) {
    const [gid, s] = k.split("|");
    if (!m.has(gid)) m.set(gid, []);
    m.get(gid).push({ sana: s, belgilar: v });
  }
  m.forEach(l => l.sort((a, b) => a.sana.localeCompare(b.sana)));
  return m;
});

// O‘quvchiga hisoblangan to‘lovlar ro‘yxati (sanasi bo‘yicha)
function hisoblar(o) {
  const r = [], b = bugun(), hozir = joriyOy();
  for (const a of o.azolik || []) {
    const g = guruh(a.guruhId);
    if (!g || !a.qoshilgan) continue;
    const narx = narxChegirma(a, +g.narx || 0);   // chegirma qo‘llangan narx
    if (g.narxTuri === "dars") {
      for (const d of davomatIndeks().get(g.id) || []) {
        if (d.sana < a.qoshilgan || (a.chiqqan && d.sana >= a.chiqqan) || d.sana > b) continue;
        const h = d.belgilar[o.id];
        if (QATNASHDI(h) || (h === "kelmadi" && SOZLAMALAR.kelmaganDarsYechilsin))
          r.push({ guruhId: g.id, davr: d.sana, davrSana: d.sana, oy: d.sana.slice(0, 7), muddat: d.sana, summa: yaxlit(narx), chegirma: yaxlit((+g.narx || 0) - narx), tavsif: `${sanaMatn(d.sana)} darsi` });
      }
    } else {
      const ox = a.chiqqan ? sanaQosh(a.chiqqan, -1) : null;
      const oxOy = ox ? (ox.slice(0, 7) < hozir ? ox.slice(0, 7) : hozir) : hozir;
      for (const ym of oylarOraligi(a.qoshilgan.slice(0, 7), oxOy)) {
        let ulush = 1;
        if (SOZLAMALAR.proporsional && (g.kunlar || []).length) {
          const kunlar = darsKunlari(g, ym);
          if (kunlar.length) {
            const faol = kunlar.filter(s => s >= a.qoshilgan && (!a.chiqqan || s < a.chiqqan)).length;
            ulush = faol / kunlar.length;
          }
        }
        if (ulush <= 0) continue;
        const muddat = `${ym}-${pad2(SOZLAMALAR.tolovKuni)}`;
        r.push({ guruhId: g.id, davr: ym, davrSana: `${ym}-01`, oy: ym, muddat: a.qoshilgan > muddat ? a.qoshilgan : muddat, summa: yaxlit(narx * ulush), chegirma: yaxlit(((+g.narx || 0) - narx) * ulush), tavsif: `${oyNomi(ym)}${ulush < 1 ? " (qisman)" : ""}` });
      }
    }
  }
  return r.filter(x => x.summa > 0).sort((x, y) => x.muddat.localeCompare(y.muddat));
}
// Chegirma: ro‘yxatdagi chegirma (foiz yoki summa) yoki qo‘lda kiritilgan foiz
function narxChegirma(a, narx) {
  const c = a.chegirmaId && byId("chegirmalar").get(a.chegirmaId);
  if (c) return c.turi === "summa" ? Math.max(0, narx - (+c.qiymat || 0)) : narx * (1 - Math.min(100, +c.qiymat || 0) / 100);
  return narx * (1 - Math.min(100, Math.max(0, +a.chegirma || 0)) / 100);
}
const chegirmaMatn = a => { const c = a.chegirmaId && byId("chegirmalar").get(a.chegirmaId); return c ? `${c.nomi} (${c.turi === "summa" ? pul(c.qiymat) : c.qiymat + "%"})` : (+a.chegirma ? `chegirma ${a.chegirma}%` : ""); };
const tolovSumma = t => (t.qaytarish ? -1 : 1) * (+t.summa || 0);   // qaytarilgan pul manfiy hisoblanadi
const oquvchiTolovlari = oid => Kesh.ol("tol:" + oid, () => DB.tolovlar.filter(t => t.oquvchiId === oid));
const tolovIndeks = () => Kesh.ol("tolIdx", () => { const m = new Map(); DB.tolovlar.forEach(t => { if (!m.has(t.oquvchiId)) m.set(t.oquvchiId, []); m.get(t.oquvchiId).push(t); }); return m; });

// Balans: to‘lovlar eski hisoblardan boshlab yopiladi (FIFO)
function hisobHolati(o) {
  return Kesh.ol("hh:" + o.id, () => {
    const hs = hisoblar(o).map(h => ({ ...h }));
    const tolangan = sum(tolovIndeks().get(o.id) || [], tolovSumma);
    let qoldi = tolangan;
    for (const h of hs) { h.tolangan = Math.min(h.summa, qoldi); qoldi -= h.tolangan; h.qarz = h.summa - h.tolangan; }
    const jami = sum(hs, h => h.summa), balans = tolangan - jami;
    const ochiq = hs.filter(h => h.qarz > 0);
    const kechikish = ochiq.length ? Math.max(0, kunFarqi(ochiq[0].muddat, bugun())) : 0;
    return { hisoblar: hs, tolangan, jami, balans, qarz: Math.max(0, -balans), ortiqcha: Math.max(0, balans), ochiq, kechikish };
  });
}
function qarzdorlar(gid = "") {
  return Kesh.ol("qd:" + gid, () => OQ()
    .filter(o => !gid || (o.azolik || []).some(a => a.guruhId === gid))
    .map(o => ({ o, h: hisobHolati(o) }))
    .filter(x => x.h.qarz > 0)
    .sort((a, b) => b.h.qarz - a.h.qarz || b.h.kechikish - a.h.kechikish));
}
const oquvchiGuruhlari = o => (o.azolik || []).filter(a => !a.chiqqan || a.chiqqan > bugun()).map(a => guruh(a.guruhId)).filter(Boolean);

// To‘lovni guruhga bog‘lash (o‘qituvchi foizi uchun): belgilangan guruh yoki o‘quvchining birinchi guruhi
function tolovGuruhi(t) {
  if (t.guruhId) return t.guruhId;
  const o = oquvchi(t.oquvchiId); if (!o) return "";
  const a = faolAzoliklar(o, t.sana || bugun())[0] || (o.azolik || [])[0];
  return a ? a.guruhId : "";
}

// Oy statistikasi
function oyStat(ym) {
  return Kesh.ol("oy:" + ym, () => {
    let hisoblangan = 0, yigilgan = 0;
    OQ().forEach(o => hisobHolati(o).hisoblar.forEach(h => { if (h.oy === ym) { hisoblangan += h.summa; yigilgan += h.tolangan; } }));
    const tushum = sum(TL().filter(t => (t.sana || "").startsWith(ym)), tolovSumma);
    const xarajat = sum(XR().filter(x => (x.sana || "").startsWith(ym)), x => x.summa);
    return { hisoblangan, yigilgan, foiz: hisoblangan ? Math.round(yigilgan * 100 / hisoblangan) : null, tushum, xarajat, foyda: tushum - xarajat };
  });
}
function guruhOyStat(g, ym) {
  let hisoblangan = 0, yigilgan = 0;
  DB.oquvchilar.forEach(o => hisobHolati(o).hisoblar.forEach(h => { if (h.guruhId === g.id && h.oy === ym) { hisoblangan += h.summa; yigilgan += h.tolangan; } }));
  const tushum = sum(DB.tolovlar.filter(t => (t.sana || "").startsWith(ym) && tolovGuruhi(t) === g.id), tolovSumma);
  const darslar = (davomatIndeks().get(g.id) || []).filter(d => d.sana.startsWith(ym)).length;
  return { hisoblangan, yigilgan, tushum, darslar, dav: davStat((gid, s) => gid === g.id && s.startsWith(ym)), oquvchi: guruhOquvchilari(g.id, ym === joriyOy() ? bugun() : oyOxiri(ym)).length };
}
function davStat(filtr) {
  let keldi = 0, kechikdi = 0, kelmadi = 0, sababli = 0;
  for (const [k, v] of Object.entries(DB.davomat)) {
    const [gid, s] = k.split("|");
    if (!filtr(gid, s)) continue;
    for (const h of Object.values(v)) { if (h === "keldi") keldi++; else if (h === "kechikdi") kechikdi++; else if (h === "kelmadi") kelmadi++; else if (h === "sababli") sababli++; }
  }
  const jami = keldi + kechikdi + kelmadi + sababli;
  return { keldi, kechikdi, kelmadi, sababli, jami, foiz: jami ? Math.round((keldi + kechikdi) * 100 / jami) : null };
}

// O‘qituvchi oyligi
function oqituvchiOylik(t, ym) {
  const gs = DB.guruhlar.filter(g => g.oqituvchiId === t.id);
  let hisob = 0, asos = 0, izoh = "";
  if (t.oylikTuri === "foiz") {
    if (t.foizAsosi === "tushgan") asos = sum(gs, g => guruhOyStat(g, ym).tushum);
    else asos = sum(gs, g => guruhOyStat(g, ym).hisoblangan);
    hisob = yaxlit(asos * (+t.stavka || 0) / 100);
    izoh = `${t.stavka || 0}% × ${pulS(asos)} (${t.foizAsosi === "tushgan" ? "tushgan pul" : "hisoblangan"})`;
  } else if (t.oylikTuri === "dars") {
    asos = sum(gs, g => guruhOyStat(g, ym).darslar);
    hisob = asos * (+t.stavka || 0);
    izoh = `${asos} ta dars × ${pulS(t.stavka || 0)}`;
  } else {
    hisob = +t.stavka || 0; izoh = "Fiks oylik";
  }
  const tolangan = sum(DB.xarajatlar.filter(x => x.kategoriya === "Oylik" && x.oqituvchiId === t.id && x.oy === ym), x => x.summa);
  return { hisob, tolangan, qoldiq: Math.max(0, hisob - tolangan), izoh, guruhlar: gs };
}

// Jadvaldagi to‘qnashuvlar (bir xona yoki bir o‘qituvchi bir vaqtda)
function toqnashuvlar() {
  return Kesh.ol("toq", () => {
    const m = new Map();
    const gs = DB.guruhlar.filter(g => g.holat !== "yopilgan" && g.boshlanish);
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
      const a = gs[i], b = gs[j];
      const kun = (a.kunlar || []).some(k => (b.kunlar || []).includes(k));
      if (!kun) continue;
      const a1 = vaqtMin(a.boshlanish), a2 = vaqtMin(a.tugash) ?? a1 + 90, b1 = vaqtMin(b.boshlanish), b2 = vaqtMin(b.tugash) ?? b1 + 90;
      if (!(a1 < b2 && b1 < a2)) continue;
      const sabab = [];
      if (a.xonaId && a.xonaId === b.xonaId) sabab.push("xona");
      if (a.oqituvchiId && a.oqituvchiId === b.oqituvchiId) sabab.push(T.oqituvchi);
      if (!sabab.length) continue;
      [a, b].forEach((g, n) => { if (!m.has(g.id)) m.set(g.id, []); m.get(g.id).push({ bilan: n ? a : b, sabab }); });
    }
    return m;
  });
}

// Ustunli diagramma: items [{kalit, yorliq, qiymat, fon?}]
function diagramma(items, { tanlangan = "", balandlik = 170, nom = "Diagramma" } = {}) {
  const max = yaxshiMax(Math.max(1, ...items.map(i => Math.max(i.qiymat, i.fon || 0))));
  const chiziqlar = [1, 0.5, 0].map(k => `<div class="d-chiziq" style="bottom:${k * 100}%"><span>${qisqaPul(max * k)}</span></div>`).join("");
  const ustunlar = items.map(i => {
    const tan = i.kalit === tanlangan;
    return `<div class="d-ustun ${tan ? "tanlangan" : ""}"><div class="d-joy">
      ${i.fon ? `<div class="d-fon" style="height:${(i.fon / max) * 100}%"></div>` : ""}
      <div class="d-bar" style="height:${(Math.max(0, i.qiymat) / max) * 100}%">${tan ? `<span class="d-teg">${qisqaPul(i.qiymat)}</span>` : ""}</div>
    </div></div>`;
  }).join("");
  const yorliqlar = items.map(i => `<div class="d-yorliq ${i.kalit === tanlangan ? "tanlangan" : ""}">${esc(i.yorliq)}</div>`).join("");
  const tavsif = items.map(i => `${i.yorliq}: ${pul(i.qiymat, " ")}`).join(", ");
  return `<div class="diagramma" style="--n:${items.length}" role="img" aria-label="${esc(nom)}. ${esc(tavsif)}">
    <div class="d-ich" style="height:${balandlik}px">${chiziqlar}<div class="d-ustunlar">${ustunlar}</div></div>
    <div class="d-yorliqlar">${yorliqlar}</div></div>`;
}
// Juft ustunli diagramma: items [{kalit, yorliq, a, b}]
function juftDiagramma(items, { tanlangan = "", balandlik = 170, nom = "" } = {}) {
  const max = yaxshiMax(Math.max(1, ...items.map(i => Math.max(i.a, i.b))));
  const chiziqlar = [1, 0.5, 0].map(k => `<div class="d-chiziq" style="bottom:${k * 100}%"><span>${qisqaPul(max * k)}</span></div>`).join("");
  const ustunlar = items.map(i => `<div class="d-ustun"><div class="d-joy"><div class="d-juft">
      <div class="a" style="height:${(i.a / max) * 100}%"></div><div class="b" style="height:${(i.b / max) * 100}%"></div></div></div></div>`).join("");
  const yorliqlar = items.map(i => `<div class="d-yorliq ${i.kalit === tanlangan ? "tanlangan" : ""}">${esc(i.yorliq)}</div>`).join("");
  const tavsif = items.map(i => `${i.yorliq}: ${pul(i.a, " ")} / ${pul(i.b, " ")}`).join(", ");
  return `<div class="diagramma" style="--n:${items.length}" role="img" aria-label="${esc(nom)}. ${esc(tavsif)}">
    <div class="d-ich" style="height:${balandlik}px;margin-top:14px">${chiziqlar}<div class="d-ustunlar">${ustunlar}</div></div>
    <div class="d-yorliqlar">${yorliqlar}</div></div>`;
}

// Fayl berish: Claude sahifasida "downloads" ruxsati, boshqa joyda oddiy yuklab olish
let YUKLASH = null;
try { if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { YUKLASH = d; }, () => {}); } catch (e) {}
async function faylBer(nom, matn, mime) {
  if (YUKLASH) {
    try { await YUKLASH.save({ filename: nom, data: matn }); toast("Fayl saqlandi"); return true; }
    catch (e) {
      if (e && e.code === "declined") { toast("Saqlash bekor qilindi", "warn"); return false; }
      if (e && e.code === "rate_limited") { toast("Biroz kutib, qayta bosing", "warn"); return false; }
      matnOynasi(nom, matn, "Bu yerda faylni yuklab bo‘lmadi."); return true;
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([matn], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {}
  matnOynasi(nom, matn);
  return true;
}
function matnOynasi(nom, matn, sabab = "") {
  Modal.och(`<h2 class="sheet-h">Fayl tayyor</h2>

    <details class="yordam" ${sabab ? "open" : ""}><summary>Fayl yuklanmadimi?</summary>
      <p class="muted sm" style="margin:0">Matnni nusxalab, bloknotga qo‘ying va <b>${esc(nom)}</b> nomi bilan saqlang.</p>

    </details>
    <div class="sheet-actions"><button class="btn btn-primary" data-act="modal-yop">Tayyor</button></div>`);
}
function nusxala(matn, el) {
  const zaxira = () => {

async function kirishTekshir(login, parol) {
  const k = UI.kirish;
  if (k.blok > Date.now()) return render();
  const x = DB.xodimlar.find(z => (z.login || "").toLowerCase() === login.trim().toLowerCase());
  if (x && x.faol !== false && (await pinXesh(parol)) === x.pinXesh) {
    Sessiya.qoy(x.id); k.xato = 0; UI.bolim = "bosh"; UI.dav = null; Ilova.holat = "ichida";
    try { history.replaceState(null, "", "#bosh"); } catch (e) {}
    render(); toast(`Xush kelibsiz, ${x.ism.split(" ")[0]}!`); return;
  }
  k.xato++;
  if (k.xato >= SOZLAMALAR.parolUrinish) { k.blok = Date.now() + 30000; k.xato = 0; render(); setTimeout(render, 30500); return; }
  xatoKorsat("#k-xato", x && x.faol === false ? "Bu xodimning kirishi o‘chirilgan. Rahbaringizga murojaat qiling." : "Login yoki parol noto‘g‘ri.");
  const p = $("#k-parol"); if (p) { p.value = ""; p.focus(); }
}

    const gs = menGuruhlarim().filter(g => g.holat !== "yopilgan");
    const dav = davStat((gid, s) => gs.some(g => g.id === gid) && s.startsWith(oy));

    return `<div class="tilelar">

  if (!GR().length && !OQ().length) {

  }

  const s = oyStat(oy), oldin = oyStat(oyQosh(oy, -1));
  const qd = qarzdorlar(), jamiQarz = sum(qd, x => x.h.qarz);
  const faol = OQ().filter(oquvchiFaol).length;
  const yangiLid = LD().filter(l => (l.yaratildi ? sanaStr(new Date(l.yaratildi)) : "").startsWith(oy)).length;

  return bolimBosh(`Shu oy: ${shuOy.length} ta lid, ${yozildi} tasi yozildi${shuOy.length ? ` (${Math.round(yozildi * 100 / shuOy.length)}%)` : ""}`, qosh) + `

          <div><button class="icon-btn tekis" data-act="guruh-tahrir" data-id="${g.id}" aria-label="Tahrirlash">${icon("edit", 20)}</button>

/* ---------- 8.5 Dars jadvali ---------- */

/* ---------- 8.6 Davomat ---------- */

    UI.davGuruh = (gs.find(g => (g.kunlar || []).includes(k)) || gs[0]).id;
  }
  const g = guruh(UI.davGuruh), s = UI.davSana, kalit = `${g.id}|${s}`;

  const kun = KUNLAR[hafta(s)], darsKuni = (g.kunlar || []).includes(kun.k), saqlangan = !!DB.davomat[kalit], bekor = DB.bekorlar[kalit];
  const tanlovHtml = `<div class="chiplar" role="group" aria-label="${katta(T.guruh)}">${gs.map(x => `<button class="chip" data-act="dav-guruh" data-id="${x.id}" aria-pressed="${x.id === g.id}">${esc(x.nomi)}</button>`).join("")}</div>
    <div class="sana-qator">
      <button class="icon-btn" data-act="dav-kun" data-n="-1" aria-label="Oldingi kun">${icon("chevL")}</button>
      <label class="vh" for="dav-sana">Sana</label><input id="dav-sana" type="date" value="${s}">
      <button class="icon-btn" data-act="dav-kun" data-n="1" aria-label="Keyingi kun">${icon("chevR")}</button>
      ${s !== bugun() ? `<button class="btn btn-soft btn-sm" data-act="dav-bugun">Bugun</button>` : ""}

      ${bekor ? `<span class="pill bad">Bekor qilingan</span>` : ""}</div>`;
  if (bekor !== undefined) return tanlovHtml + `<section class="card bosh-holat"><div class="bh-ic">${icon("x", 30)}</div><h3>Dars bekor qilingan</h3><p>${esc(bekor || "Sabab ko‘rsatilmagan")}</p>
    ${oqituvchiMi() ? "" : `<button class="btn btn-soft" data-act="dav-bekor-qaytar">Bekorni qaytarish</button>`}</section>`;
  if (!l.length) return tanlovHtml + boshHolat({ ic: "users", sarlavha: `Bu ${T.guruh}da ${T.oquvchi} yo‘q`, matn: `${esc(g.nomi)} ${T.guruh}iga ${T.oquvchi} qo‘shing (o‘quvchi profilidan).` });
  return tanlovHtml + `<section class="card">
      <div class="card-h"><h2>${esc(g.nomi)}</h2><div class="amal-qator"><button class="btn btn-ghost btn-sm" data-act="dav-bekor">Darsni bekor qilish</button><button class="btn btn-soft btn-sm" data-act="dav-hammasi">Hammasi keldi</button></div></div>
      <div class="xulosa x5" id="dav-xulosa">${davXulosa(l)}</div>
      <div class="royxat" style="margin-top:6px">${l.map(o => `<div class="dav-qator">
        <div class="dq-ism"><span class="avatar">${esc(boshHarf(o.ism))}</span><span>${esc(o.ism)}</span></div>
        <div class="dav-tugmalar" role="group" aria-label="${esc(o.ism)} davomati">${Object.keys(HOLAT_NOMI).map(v => `<button class="mark" data-act="dav-belgi" data-oid="${o.id}" data-v="${v}" aria-pressed="${UI.dav.belgilar[o.id] === v}">${HOLAT_NOMI[v]}</button>`).join("")}</div>

}
function davXulosa(l) {
  const b = UI.dav.belgilar, c = { keldi: 0, kechikdi: 0, kelmadi: 0, sababli: 0 };
  l.forEach(o => { if (c[b[o.id]] !== undefined) c[b[o.id]]++; });
  return `<div class="k"><b>${c.keldi}</b><span>Keldi</span></div><div class="s"><b>${c.kechikdi}</b><span>Kechikdi</span></div><div class="m"><b>${c.kelmadi}</b><span>Kelmadi</span></div><div><b>${c.sababli}</b><span>Sababli</span></div><div><b>${l.length - c.keldi - c.kechikdi - c.kelmadi - c.sababli}</b><span>Belgilanmagan</span></div>`;
}
function davHolatMatni(l) {
  if (UI.dav.ozgardi) return "O‘zgarishlar saqlanmagan";
  const n = l.filter(o => UI.dav.belgilar[o.id]).length;
  return n ? `${l.length} tadan ${n} tasi belgilangan` : "Har bir ism yonidagi tugmani bosing";
}
function davYangila() {

  const bar = $("#saqla-bar"); if (bar) bar.classList.toggle("ozgardi", UI.dav.ozgardi);
  const h = $("#saqla-holat"); if (h) h.textContent = davHolatMatni(l);
}

  Object.assign(UI, yangi); UI.dav = null; render();
}

        <button type="submit" class="btn btn-primary btn-blok">${icon("check2", 20)} To‘lovni saqlash</button>

      <label><span class="vh">Oy</span><select id="t-tarix-oy" style="min-height:40px;padding:6px 10px"><option value="">Barcha oylar</option>${tarixOylar.map(m => `<option value="${m}" ${m === UI.tolovOy ? "selected" : ""}>${oyNomi(m)}</option>`).join("")}</select></label></div>
      <div id="t-tarix">${tolovTarixi()}</div></section></div>`;

function tolovTanla(oid) {

/* ---------- 8.8 Qarzdorlar ---------- */
function renderQarzdorlar() {

  const gs = GR().filter(g => hammasi.some(x => (x.o.azolik || []).some(a => a.guruhId === g.id))).sort(ismBoyicha);
  if (UI.qarzGuruh && !gs.some(g => g.id === UI.qarzGuruh)) UI.qarzGuruh = "";
  const l = qarzdorlar(UI.qarzGuruh);
  const kechikkan = l.filter(x => x.h.kechikish > 0);
  return `<div class="chiplar" role="group" aria-label="${katta(T.guruh)} bo‘yicha">

      ${gs.map(g => `<button class="chip" data-act="qarz-guruh" data-id="${g.id}" aria-pressed="${UI.qarzGuruh === g.id}">${esc(g.nomi)} <span class="son">${qarzdorlar(g.id).length}</span></button>`).join("")}
    </div>
    <section class="card jami-qator">
