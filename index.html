      <div><div class="muted sm">Muddati o‘tgan</div><div style="font-size:22px;font-weight:700" class="warn-matn">${kechikkan.length} ta</div></div>

    <div class="kartalar">${l.map(x => `<article class="card qarz-k">

        <div class="q-mat"><button class="lk-nom q-nom" style="background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:left" data-act="profil" data-id="${x.o.id}">${esc(x.o.ism)}</button>
        <div class="q-sub">${oquvchiGuruhlari(x.o).map(g => esc(g.nomi)).join(", ") || "Ketgan"}${x.o.otaTel ? ` · ${esc(x.o.otaTel)}` : ""}</div></div>

const QOLIPLAR = {

function xabarKarta(id, ism, tel, matn, izoh) {

function renderXabarlar() {

    if (!l.length) return html + boshHolat({ ic: "check2", sarlavha: "Qarzdorlar yo‘q", matn: "Eslatma yuboradigan hech kim yo‘q." });
    return html + `<div class="kartalar">${l.map(x => xabarKarta(`q-${x.o.id}`, x.o.ism, x.o.otaTel || x.o.tel,

      `Qarz <b class="qizil">${pulS(x.h.qarz)}</b> · ${davrMatni(x.h)}`)).join("")}</div>`;

      return html + boshHolat({ ic: "users", sarlavha: `${sanaMatn(s)} kuni kelmaganlar yo‘q`, matn: "Davomatda «Kelmadi» belgilanganlar shu yerda chiqadi.", tugma: oxirgi && oxirgi !== s ? `<button class="btn btn-soft" data-act="x-sana-qoy" data-s="${oxirgi}">Oxirgi kelmagan kun: ${sanaMatn(oxirgi)}</button>` : "" });
    }
    return html + `<div class="kartalar">${yoz.map(({ o, g }) => xabarKarta(`k-${o.id}-${g.id}`, o.ism, o.otaTel || o.tel,
      shablonTold("kelmadi", { ism: o.ism, sana: sanaMatn(s), guruh: g.nomi, oqituvchi: oqituvchiNomi(g), markaz }),

  }
  const nomlar = { qarz: "Qarz eslatmasi", kelmadi: "Kelmaganlik haqida", tolov: "To‘lov cheki", lid: "Lidga taklif" };
  return html + `<div class="ikki-ustun">${Object.keys(QOLIPLAR).map(tur => `<section class="card"><div class="card-h"><h2>${nomlar[tur]}</h2></div>

      <button class="btn btn-ghost" data-act="shablon-asl">Asl holiga qaytarish</button></div>` : ""}`;
}

/* ---------- 9.2 Kassa (xarajat va foyda) ---------- */
function renderKassa() {
  const oy = UI.kassaOy, s = oyStat(oy), dir = direktorMi();
  const xs = XR().filter(x => (x.sana || "").startsWith(oy)).sort((a, b) => (b.sana || "").localeCompare(a.sana || "") || (b.yaratildi || 0) - (a.yaratildi || 0));
  const kat = SOZLAMALAR.xarajatTurlari.map(k => [k, sum(xs.filter(x => x.kategoriya === k), x => x.summa)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  const maxK = Math.max(1, ...kat.map(x => x[1]));
  const oylar = Array.from({ length: 6 }, (_, i) => oyQosh(oy, i - 5));
  // Kassa qoldig‘i usul bo‘yicha (barcha vaqt)
  const qoldiq = SOZLAMALAR.tolovUsullari.map(u => [u, sum(TL().filter(t => t.usul === u), tolovSumma) - sum(XR().filter(x => x.usul === u), x => x.summa)]);
  return bolimBosh(`${oyNomi(oy)}: ${xs.length} ta xarajat`, `<button class="btn btn-primary" data-act="xarajat-yangi">${icon("plus", 18)} Xarajat qo‘shish</button>`) + oyNav("kassa-oy", oy) + `
    <div class="tilelar" style="grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))">
      ${tile("Tushum", pulV(s.tushum), "To‘lovlar", "wallet")}
      ${tile("Xarajat", pulV(s.xarajat), `${xs.length} ta yozuv`, "cash", "warn")}
      ${dir ? tile("Sof foyda", `<span class="${s.foyda < 0 ? "qizil" : "yashil"}">${pul(s.foyda)}</span><small>${SOZLAMALAR.valyuta}</small>`, s.tushum ? `Rentabellik ${Math.round(s.foyda * 100 / s.tushum)}%` : "", "chart") : ""}
    </div>
    ${dir ? `<div class="ikki-ustun">
      <section class="card"><div class="card-h"><div><h2>Tushum va xarajat</h2><div class="muted sm">So‘nggi 6 oy</div></div></div>
        <div class="legend"><span><i class="l-bar"></i>Tushum</span><span><i class="l-b"></i>Xarajat</span></div>
        ${juftDiagramma(oylar.map(m => { const x = oyStat(m); return { kalit: m, yorliq: oyQisqa(m), a: x.tushum, b: x.xarajat }; }), { tanlangan: oy, nom: "Tushum va xarajat" })}</section>
      <section class="card"><div class="card-h"><div><h2>Kassa qoldig‘i</h2><div class="muted sm">Barcha vaqt: kirim − chiqim</div></div></div>
        <table class="mini-jadval"><tbody>${qoldiq.map(([u, v]) => `<tr><td>${esc(u)}</td><td class="o"><b class="${v < 0 ? "qizil" : ""}">${pulS(v)}</b></td></tr>`).join("")}
        <tr><td><b>Jami</b></td><td class="o"><b>${pulS(sum(qoldiq, x => x[1]))}</b></td></tr></tbody></table></section>
    </div>` : ""}
    <section class="card"><div class="card-h"><h2>Xarajat turlari</h2></div>
      ${kat.length ? kat.map(([k, v]) => `<div class="kat-q"><span>${esc(k)}</span>${progress(v * 100 / maxK, "warn")}<b>${pulS(v)}</b></div>`).join("") : `<p class="bosh-matn">Bu oyda xarajat yo‘q.</p>`}</section>
    <section class="card"><div class="card-h"><h2>Xarajatlar</h2><button class="btn btn-ghost btn-sm" data-act="csv" data-tur="xarajatlar">${icon("file", 18)} Excel</button></div>
      ${xs.length ? `<div class="royxat">${xs.map(x => `<div class="qator"><span class="avatar">${icon("cash", 20)}</span>
        <div class="q-mat"><div class="q-nom">${esc(x.kategoriya)}${x.oqituvchiId && oqituvchi(x.oqituvchiId) ? `: ${esc(oqituvchi(x.oqituvchiId).ism)}` : ""}</div>
        <div class="q-sub">${sanaMatn(x.sana)} · ${esc(x.usul || "")}${x.izoh ? ` · ${esc(x.izoh)}` : ""}</div></div>
        <div class="q-ong"><b>${pulS(x.summa)}</b></div>
        ${dir ? `<button class="icon-btn tekis" data-act="xarajat-ochir" data-id="${x.id}" aria-label="O‘chirish">${icon("trash", 18)}</button>` : ""}</div>`).join("")}</div>` : `<p class="bosh-matn">Bu oyda xarajat kiritilmagan.</p>`}</section>`;
}

/* ---------- 9.5 Zaxira, tiklash, CSV ---------- */
const faylNomi = () => markazNomi().toLowerCase().replace(/[‘’'`ʻ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "markaz";
async function zaxiraOl() {
  const nusxa = { ...DB, meta: { ...DB.meta, oxirgiZaxira: bugun() } };
  const ok = await faylBer(`${faylNomi()}-zaxira-${bugun()}.json`, JSON.stringify(nusxa, null, 1), "application/json");
  if (!ok) return;
  DB.meta.oxirgiZaxira = bugun(); Ombor.sozYoz(); render();
}
async function tikla(matn) {
  let x;
  try { x = JSON.parse(matn); } catch (e) { toast("Fayl o‘qilmadi: bu zaxira fayli emas", "warn"); return; }
  if (!x || !Array.isArray(x.oquvchilar) || !Array.isArray(x.guruhlar)) { toast("Bu faylda zaxira ma’lumotlari topilmadi", "warn"); return; }
  const ha = await tasdiq(`Zaxirada ${x.guruhlar.length} ta ${T.guruh}, ${x.oquvchilar.length} ta ${T.oquvchi} bor. Joriy ma’lumotlar almashtiriladi.`, { tugma: "Tiklash", sarlavha: "Zaxiradan tiklash", xavfli: true });
  if (!ha) return;
  try {
    toast("Tiklanmoqda…");
    await Ombor.almashtir(x);
    if (!DB.xodimlar.length) { Sessiya.tugat(); Ilova.holat = "kirish"; UI.kirish.tab = "royxat"; }
    else if (!men()) { Sessiya.tugat(); Ilova.holat = "kirish"; UI.kirish.tab = "kirish"; }
    UI.dav = null; UI.tf.oid = ""; Server.holat = "kutilmoqda"; render(); toast("Ma’lumotlar tiklandi");
    Server.tekshir();
  } catch (e) { toast("Tiklashda xato: " + (e.message || e), "warn"); }
}
function csvMatn(q) {
  const f = v => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return "﻿" + q.map(r => r.map(f).join(";")).join("\r\n");
}
const CSV = {
  oquvchilar: () => [["Ism", "Telefon", `${katta(T.otaOna)} telefoni`, katta(T.guruhlar), "Holati", "Manba", "Tug‘ilgan sana", "Balans", "Qarz"],
    ...OQ().slice().sort(ismBoyicha).map(o => { const h = hisobHolati(o); return [o.ism, o.tel, o.otaTel, oquvchiGuruhlari(o).map(g => g.nomi).join(", "), oquvchiFaol(o) ? "Faol" : "Ketgan", o.manba, o.tugilgan, h.balans, h.qarz]; })],
  tolovlar: () => [["Sana", katta(T.oquvchi), katta(T.guruh), "Summa", "Usul", "Qabul qildi", "Izoh"],
    ...TL().slice().sort((a, b) => (a.sana || "").localeCompare(b.sana || "")).map(t => [t.sana, (oquvchi(t.oquvchiId) || {}).ism || "", (guruh(tolovGuruhi(t)) || {}).nomi || "", t.summa, t.usul, (xodim(t.xodimId) || {}).ism || "", t.izoh || ""])],
  qarzdorlar: () => [[katta(T.oquvchi), `${katta(T.otaOna)} telefoni`, katta(T.guruhlar), "Qarz", "Davr", "Kechikkan kun"],
    ...qarzdorlar().map(x => [x.o.ism, x.o.otaTel, oquvchiGuruhlari(x.o).map(g => g.nomi).join(", "), x.h.qarz, davrMatni(x.h), x.h.kechikish])],
  lidlar: () => [["Yaratilgan", "Ism", "Telefon", "Kurs", "Manba", "Holat", "Sinov sanasi", "Keyingi bog‘lanish", "Izoh"],
    ...LD().map(l => [l.yaratildi ? sanaStr(new Date(l.yaratildi)) : "", l.ism, l.tel, l.qiziqish, l.manba, (LID_HOLAT.find(h => h.k === l.holat) || {}).n || l.holat, l.sinovSana, l.keyingiAloqa, l.izoh])],
  xarajatlar: () => [["Sana", "Turi", "Summa", "Usul", katta(T.oqituvchi), "Izoh"],
    ...XR().slice().sort((a, b) => (a.sana || "").localeCompare(b.sana || "")).map(x => [x.sana, x.kategoriya, x.summa, x.usul, (oqituvchi(x.oqituvchiId) || {}).ism || "", x.izoh || ""])],
  guruhlar: () => { const oy = joriyOy(); return [[katta(T.guruh), katta(T.oqituvchi), "Narx", "Turi", katta(T.oquvchilar), "Davomat %", "Hisoblangan", "Yig‘ilgan"],
    ...GR().map(g => { const s = guruhOyStat(g, oy); return [g.nomi, oqituvchiNomi(g), g.narx, g.narxTuri === "dars" ? "Har dars" : "Oylik", s.oquvchi, s.dav.foiz ?? "", s.hisoblangan, s.yigilgan]; })]; },
};
function csvBer(tur) {
  const q = CSV[tur]();
  if (q.length < 2) { toast("Eksport uchun ma’lumot yo‘q", "warn"); return; }
  faylBer(`${tur}-${bugun()}.csv`, csvMatn(q), "text/csv;charset=utf-8");
}

/* =====================================================================
   12. FILIAL BO‘YICHA KO‘RINISH VA YORDAMCHILAR
   Xodimga filial biriktirilgan bo‘lsa yoki direktor tepada filial tanlasa,
   ro‘yxat va statistikalar faqat o‘sha filial bo‘yicha chiqadi.
   ===================================================================== */
function joriyFilial() { const m = Sessiya.xodimId && xodim(Sessiya.xodimId); return (m && m.filialId) || UI.filial || ""; }
function GR() { return Kesh.ol("GR", () => { const F = joriyFilial(); return F ? DB.guruhlar.filter(g => g.filialId === F) : DB.guruhlar; }); }
function OQ() {
  return Kesh.ol("OQ", () => {
    const F = joriyFilial(); if (!F) return DB.oquvchilar;
    return DB.oquvchilar.filter(o => (o.azolik || []).some(a => (guruh(a.guruhId) || {}).filialId === F) || (!(o.azolik || []).length && o.filialId === F));
  });
}
function TL() { return Kesh.ol("TL", () => { if (!joriyFilial()) return DB.tolovlar; const ids = new Set(OQ().map(o => o.id)); return DB.tolovlar.filter(t => ids.has(t.oquvchiId)); }); }
function XR() { return Kesh.ol("XR", () => { const F = joriyFilial(); return F ? DB.xarajatlar.filter(x => x.filialId === F) : DB.xarajatlar; }); }
function LD() { return Kesh.ol("LD", () => { const F = joriyFilial(); return F ? DB.lidlar.filter(l => !l.filialId || l.filialId === F) : DB.lidlar; }); }
function SR() { return Kesh.ol("SR", () => { const F = joriyFilial(); return F ? DB.sorovlar.filter(l => !l.filialId || l.filialId === F) : DB.sorovlar; }); }
const kursNomi = g => (g && (byId("kurslar").get(g.kursId) || {}).nomi) || (g && g.fan) || "";
const guruhSigimi = g => +g.sigim || +((xona(g.xonaId) || {}).sigim) || 0;
function chegirmaOptions(val) {
  const l = DB.chegirmalar.filter(c => c.faol !== false || c.id === val);
  return `<option value="">Chegirmasiz</option>` + l.map(c => `<option value="${c.id}" ${c.id === val ? "selected" : ""}>${esc(c.nomi)} (${c.turi === "summa" ? pul(c.qiymat) + " " + SOZLAMALAR.valyuta : c.qiymat + "%"})</option>`).join("")
    + [5, 10, 15, 20, 25, 30, 50].map(p => `<option value="f:${p}" ${val === "f:" + p ? "selected" : ""}>Boshqa: ${p}%</option>`).join("");
}
const chegirmaQiymat = v => (v && v.startsWith("f:") ? { chegirmaId: "", chegirma: +v.slice(2) } : { chegirmaId: v || "", chegirma: 0 });
Ombor.bekorYoz = function (kalit, sabab) { if (sabab === null) delete DB.bekorlar[kalit]; else DB.bekorlar[kalit] = sabab; ozgardi(); this.saqla(); };

/* ---------- Davr bo‘yicha hisob-kitob ---------- */
const birinchiQoshilgan = o => (o.azolik || []).map(a => a.qoshilgan).filter(Boolean).sort()[0] || "";
const oxirgiChiqqan = o => { const a = o.azolik || []; if (!a.length || a.some(x => !x.chiqqan)) return ""; return a.map(x => x.chiqqan).sort().pop(); };
const sanadaFaol = (o, s) => (o.azolik || []).some(a => azolikFaol(a, s));

// Davrni bo‘laklarga bo‘lish (kunlik / haftalik / oylik)
function bolaklar(dan, gacha, qadam) {
  const r = [];
  if (qadam === "oylik") {
    for (const ym of oylarOraligi(dan.slice(0, 7), gacha.slice(0, 7))) r.push({ kalit: ym, yorliq: oyQisqa(ym) + " " + ym.slice(2, 4), dan: ym + "-01" < dan ? dan : ym + "-01", gacha: oyOxiri(ym) > gacha ? gacha : oyOxiri(ym) });
  } else {
    const q = qadam === "haftalik" ? 7 : 1;
    for (let s = dan; s <= gacha && r.length < 400; s = sanaQosh(s, q)) {
      const ox = sanaQosh(s, q - 1);
      r.push({ kalit: s, yorliq: `${+s.slice(8)} ${OYLAR[+s.slice(5, 7) - 1].slice(0, 3).toLowerCase()}`, dan: s, gacha: ox > gacha ? gacha : ox });
    }
  }
  return r;
}
function davrStat(dan, gacha) {
  return Kesh.ol(`ds:${dan}:${gacha}`, () => {
    const ichida = s => s && s >= dan && s <= gacha;
    const tl = TL().filter(t => ichida(t.sana));
    const tushum = sum(tl.filter(t => !t.qaytarish), t => t.summa), qaytarilgan = sum(tl.filter(t => t.qaytarish), t => t.summa);
    const xr = XR().filter(x => ichida(x.sana));
    const xarajat = sum(xr, x => x.summa), ishHaqi = sum(xr.filter(x => x.kategoriya === "Oylik"), x => x.summa);
    let hisoblangan = 0, yigilgan = 0, chegirma = 0, muddatiOtgan = 0, otganSoni = 0;
    const b = bugun();
    OQ().forEach(o => hisobHolati(o).hisoblar.forEach(h => {
      if (ichida(h.davrSana)) { hisoblangan += h.summa; yigilgan += h.tolangan; chegirma += h.chegirma || 0; }
      if (h.qarz > 0 && h.muddat < b) { muddatiOtgan += h.qarz; otganSoni++; }
    }));
    const gIds = new Set(GR().map(g => g.id));
    const dav = davStat((gid, s) => gIds.has(gid) && ichida(s));
    const oxir = gacha > b ? b : gacha;
    const boshida = OQ().filter(o => sanadaFaol(o, dan));
    const qolgan = boshida.filter(o => sanadaFaol(o, oxir)).length;
    const yangi = OQ().filter(o => ichida(birinchiQoshilgan(o))).length;
    const ketgan = OQ().filter(o => ichida(oxirgiChiqqan(o))).length;
    return {
      tushum, qaytarilgan, sofTushum: tushum - qaytarilgan, xarajat, ishHaqi, sof: tushum - qaytarilgan - xarajat,
      hisoblangan, yigilgan, undirilish: hisoblangan ? Math.round(yigilgan * 100 / hisoblangan) : null, chegirma,
      muddatiOtgan, otganSoni, tolovSoni: tl.filter(t => !t.qaytarish).length, dav,
      yangi, ketgan, boshida: boshida.length, saqlanish: boshida.length ? Math.round(qolgan * 100 / boshida.length) : null,
    };
  });
}
const farqMatn = (a, b, teskari = false) => {
  if (!b) return "";
  const f = Math.round((a - b) * 100 / Math.abs(b)), yaxshi = teskari ? f <= 0 : f >= 0;
  return `<span class="farq ${yaxshi ? "up" : "down"}">${f >= 0 ? "↑" : "↓"} ${Math.abs(f)}%</span> oldingi davrga nisbatan`;
};

// Chiziqli grafik: series [{nom, rang, q:[son|null]}]
function chiziq(series, yorliqlar, { balandlik = 200, foiz = false } = {}) {
  const hamma = series.flatMap(s => s.q.filter(v => v !== null && v !== undefined));
  if (!hamma.length) return `<p class="bosh-matn">Bu davrda ma’lumot yo‘q.</p>`;
  let max = Math.max(0, ...hamma), min = Math.min(0, ...hamma);
  if (foiz) { max = 100; min = 0; } else { max = max > 0 ? yaxshiMax(max) : 0; min = min < 0 ? -yaxshiMax(-min) : 0; if (max === min) max = 1; }
  const n = yorliqlar.length, X = i => (n === 1 ? 50 : (i * 100) / (n - 1)), Y = v => 100 - ((v - min) / (max - min)) * 100;
  const fmt = v => (foiz ? Math.round(v) + "%" : qisqaPul(v));
  const chiz = [max, (max + min) / 2, min].map(v => `<div class="d-chiziq" style="bottom:${100 - Y(v)}%"><span>${fmt(v)}</span></div>`).join("") + (min < 0 ? `<div class="nol" style="top:${Y(0)}%"></div>` : "");
  const polylar = series.map((s, si) => {
    const pts = s.q.map((v, i) => (v === null || v === undefined ? null : `${X(i).toFixed(2)},${Y(v).toFixed(2)}`)).filter(Boolean);
    if (!pts.length) return "";
    const maydon = si === 0 && !foiz ? `<polygon points="${pts[0].split(",")[0]},${Y(Math.max(0, min))} ${pts.join(" ")} ${pts[pts.length - 1].split(",")[0]},${Y(Math.max(0, min))}" style="fill:${s.rang}"/>` : "";
    return maydon + `<polyline points="${pts.join(" ")}" style="stroke:${s.rang}"/>`;
  }).join("");
  const nuqtalar = series.map(s => { let i = s.q.length - 1; while (i >= 0 && (s.q[i] === null || s.q[i] === undefined)) i--; return i < 0 ? "" : `<span class="cx-nuqta" style="left:${X(i)}%;bottom:${100 - Y(s.q[i])}%;background:${s.rang}" title="${esc(s.nom)}: ${fmt(s.q[i])}"></span>`; }).join("");
  const qadam = Math.max(1, Math.ceil(n / 8));
  const xl = yorliqlar.map((l, i) => (i % qadam === 0 || i === n - 1 ? `<span class="cx-yorliq" style="left:${X(i)}%">${esc(l)}</span>` : "")).join("");
  const tavsif = series.map(s => `${s.nom}: ${s.q.filter(v => v !== null).map(fmt).join(", ")}`).join("; ");
  return `<div class="chiziq-q" role="img" aria-label="${esc(tavsif)}"><div class="chiziq" style="height:${balandlik}px">${chiz}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${polylar}</svg>${nuqtalar}${xl}</div>
    ${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="lc" style="background:${s.rang}"></i>${esc(s.nom)}</span>`).join("")}</div>` : ""}</div>`;
}
// Gorizontal ustunlar: items [{nom, q, matn}]
function qatorlar(items, { foiz = false, cls = "", bosh = "Ma’lumot yo‘q." } = {}) {
  if (!items.length) return `<p class="bosh-matn">${bosh}</p>`;
  const max = foiz ? 100 : Math.max(1, ...items.map(i => i.q));
  return items.map(i => `<div class="kat-q"><span>${esc(i.nom)}</span>${progress((i.q * 100) / max, cls)}<b>${i.matn ?? (foiz ? i.q + "%" : pul(i.q))}</b></div>`).join("");
}
const RANG = { a: "var(--primary)", b: "var(--warn)", c: "var(--ok)", d: "var(--bad)" };

const DIQQAT_TUR = { guruh: "Guruh holati", qatnashmayapti: `${katta(T.oquvchi)} qatnashmayapti`, tolov: "To‘lov muddati o‘tgan", davomat: "Davomat belgilanmagan", lid: "Lidlar", oylik: "Oylik", sorov: "So‘rovlar" };

        if ((g.kunlar || []).includes(KUNLAR[hafta(s)].k) && (!g.ochilgan || s >= g.ochilgan) && !DB.davomat[k] && DB.bekorlar[k] === undefined && guruhOquvchilari(g.id, s).length) qolgan.push(s);

        if (oxirgi3.length === 3 && oxirgi3.every(x => x.h === "kelmadi")) r.push({ id: "q3" + o.id + a.guruhId, tur: "qatnashmayapti", daraja: "muhim", sarlavha: `${o.ism} 3 darsdan beri kelmayapti`, matn: `${g.nomi}. Oxirgi: ${sanaMatn(oxirgi3[2].s)}. ${katta(T.otaOna)} bilan bog‘laning.`, act: "profil", aid: o.id, tugma: "Profil" });

      }
      const lidlar = LD().filter(l => !["yozildi", "rad"].includes(l.holat) && l.keyingiAloqa && l.keyingiAloqa < b);
      if (lidlar.length) r.push({ id: "lid", tur: "lid", daraja: "ogohlantirish", sarlavha: `${lidlar.length} ta lid bilan bog‘lanish kechikdi`, matn: lidlar.slice(0, 4).map(l => l.ism).join(", ") + (lidlar.length > 4 ? "…" : ""), act: "ot", bolim: "lidlar", tugma: "Lidlar" });

function xavf(o) {
  return Kesh.ol("xavf:" + o.id, () => {
    const r = [], b = bugun();

      if (bl.length >= 3 && bl.slice(-3).every(h => h === "kelmadi")) r.push("3 darsdan beri kelmayapti");
      const songgi = (davomatIndeks().get(a.guruhId) || []).filter(d => d.sana >= sanaQosh(b, -14) && d.belgilar[o.id]).map(d => d.belgilar[o.id]);
      if (songgi.length >= 3 && songgi.filter(QATNASHDI).length / songgi.length < 0.5) r.push("Davomat 50% dan past");

}

    if (s && !((o.ism || "").toLowerCase().includes(s) || (sr.length >= 2 && `${o.tel}${o.otaTel}`.replace(/\D/g, "").includes(sr)))) return false;
    if (!oq && q.tab !== "hammasi") {

}

// CSV import: Ism; Telefon; Ota-ona telefoni; Guruh; Qo‘shilgan sana
function importTahlil(matn) {
  const qatorlar = matn.replace(/^﻿/, "").split(/\r?\n/).filter(x => x.trim());
  if (!qatorlar.length) return [];
  const ajr = [";", "\t", ","].map(a => [a, qatorlar[0].split(a).length]).sort((a, b) => b[1] - a[1])[0][0];
  const bol = q => { const r = []; let cur = "", qq = false; for (const c of q) { if (c === '"') qq = !qq; else if (c === ajr && !qq) { r.push(cur.trim()); cur = ""; } else cur += c; } r.push(cur.trim()); return r; };
  let rows = qatorlar.map(bol), ustun = { ism: 0, tel: 1, ota: 2, guruh: 3, sana: 4 };
  const sar = rows[0].map(x => x.toLowerCase());
  if (sar.some(x => /ism|name|f\.?i\.?o/.test(x))) {
    const top = re => sar.findIndex(x => re.test(x));
    ustun = { ism: top(/ism|name|f\.?i\.?o/), tel: top(/^tel|telefon|phone/), ota: top(/ota|ona|parent/), guruh: top(/guruh|group|sinf/),
      tug: top(/tug|birth/), sana: sar.findIndex(x => /sana|date/.test(x) && !/tug|birth/.test(x)) };
    rows = rows.slice(1);
  }
  const gNom = new Map(GR().map(g => [g.nomi.toLowerCase().trim(), g.id]));
  return rows.map(r => ({ ism: r[ustun.ism] || "", tel: ustun.tel >= 0 ? r[ustun.tel] || "" : "", otaTel: ustun.ota >= 0 ? r[ustun.ota] || "" : "",
    guruhId: ustun.guruh >= 0 ? gNom.get((r[ustun.guruh] || "").toLowerCase().trim()) || "" : "", guruhNomi: ustun.guruh >= 0 ? r[ustun.guruh] || "" : "",
    tugilgan: ustun.tug >= 0 && /^\d{4}-\d{2}-\d{2}$/.test(r[ustun.tug] || "") ? r[ustun.tug] : "",
    sana: ustun.sana >= 0 && /^\d{4}-\d{2}-\d{2}$/.test(r[ustun.sana] || "") ? r[ustun.sana] : bugun() })).filter(x => x.ism);
}

    else if (v === "otgan") { const o = oyQosh(joriyOy(), -1); st.dan = o + "-01"; st.gacha = oyOxiri(o); st.qadam = "kunlik"; }
    else if (v === "90") { st.dan = sanaQosh(b, -89); st.gacha = b; st.qadam = "haftalik"; }
    else { st.dan = oyQosh(joriyOy(), -11) + "-01"; st.gacha = b; st.qadam = "oylik"; }

/* =====================================================================
   13. MARKAZLAR SERVERI (Google Sheets + Apps Script)
   Serverda faqat markaz kartasi: nomi, rahbar, telefon, holati va muddati.
   O‘quvchi, to‘lov va boshqa ma’lumotlar shu qurilmada qoladi.
   Dastur har ochilganda va ochiq turganda vaqti-vaqti bilan holatni so‘raydi:
   bloklangan yoki muddati tugagan markaz ishlay olmaydi, internet bo‘lmasa ochilmaydi.
   ===================================================================== */
const Server = {
  holat: "kutilmoqda",   // kutilmoqda | ok | internet | topilmadi | ulanmagan | sozlanmagan
  bugun: "",             // server sanasi (qurilma soatini o‘zgartirib aldab bo‘lmasin)
  xato: "",
  taymer: null,
  async sorov(amal, d = {}) {
    if (!SOZLAMALAR.server) { const e = new Error("Server manzili sozlanmagan"); e.kod = "sozlanmagan"; throw e; }
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), 25000);
    try {
      // text/plain — brauzer qo‘shimcha (preflight) so‘rov yubormaydi, Apps Script shuni kutadi
      const r = await fetch(SOZLAMALAR.server, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ amal, ...d }), signal: ac.signal, redirect: "follow" });
      if (!r.ok) throw new Error("Server javobi: " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  },
  qabul(j) {
    const L = DB.litsenziya;
    Object.assign(L, { holat: j.holat || "faol", sinovTugash: j.sinovTugash || L.sinovTugash || "", tugash: j.tugash || "", xabar: j.xabar || "", tekshirildi: Date.now(),
      tarif: j.tarif || "", kutilayotgan: +j.kutilayotgan || 0, tolovYoqilgan: !!j.tolovYoqilgan });
    if (Array.isArray(j.tariflar) && j.tariflar.length) L.tariflar = j.tariflar;
    if (Array.isArray(j.oylar) && j.oylar.length) L.oylar = j.oylar;
    if (j.bugun) this.bugun = j.bugun;
    Ombor.sozYoz();
  },
  stat() {
    return { oquvchilar: DB.oquvchilar.filter(oquvchiFaol).length, guruhlar: DB.guruhlar.filter(g => g.holat !== "yopilgan").length, xodimlar: DB.xodimlar.length, versiya: SOZLAMALAR.versiya };
  },
  async tekshir() {
    const oldin = this.holat + "|" + JSON.stringify(DB.litsenziya);
    if (DB.meta.demo || !markazBor()) this.holat = "ok";
    else if (!DB.litsenziya.markazId) this.holat = "ulanmagan";
    else {
      try {
        const L = DB.litsenziya, j = await this.sorov("holat", { id: L.markazId, token: L.token, nomi: DB.sozlamalar.markazNomi, stat: this.stat() });
        if (j.ok) { this.qabul(j); this.holat = "ok"; this.xato = ""; }
        else if (j.kod === "topilmadi") this.holat = "topilmadi";
        else { this.holat = "internet"; this.xato = j.xato || ""; }
      } catch (e) { this.holat = e.kod === "sozlanmagan" ? "sozlanmagan" : "internet"; this.xato = e.name === "AbortError" ? "Server javob bermadi" : e.message || ""; }
    }
    // Holat o‘zgarmagan bo‘lsa, yozilayotgan maydonni buzmaslik uchun ehtiyotkor qayta chizish
    if (oldin !== this.holat + "|" + JSON.stringify(DB.litsenziya)) { if (this.holat === "ok") rejaRender(); else render(); }
  },
  boshla() {
    if (location.hash === "#tolov") {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (DB.litsenziya.markazId && !DB.meta.demo) { toast("To‘lov tekshirilmoqda…"); tolovKut(12); }
    }
    this.tekshir();
    clearInterval(this.taymer);
    this.taymer = setInterval(() => this.tekshir(), SOZLAMALAR.tekshirDaqiqa * 60000);
    window.addEventListener("online", () => this.tekshir());
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && Date.now() - (DB.litsenziya.tekshirildi || 0) > 60000) this.tekshir();
    });
  },
};
const serverBugun = () => Server.bugun || bugun();

const TARIFLAR_STD = [

function tarifJoriy() {
  const L = DB.litsenziya;

function limitXato(qoshiladi) {
  const t = tarifJoriy();

  if (bor + qoshiladi <= t.limit) return "";
  return `${t.nom} tarifida ${t.limit} tagacha faol ${T.oquvchi} bo‘ladi (hozir ${bor} ta). Ko‘proq ${T.oquvchi} uchun tarifni oshiring: Sozlamalar → Obuna.`;
}
function tarifLimitOyna(matn) {

const tolovUI = () => (UI.tolov = UI.tolov || { tarif: DB.litsenziya.tarif || "standart", oylar: 1, kutish: false });

// Tarif kartalari + muddat + «To‘lash» (Obuna sahifasida va muddat tugagan oynada)
function tarifTanlov() {
  const L = DB.litsenziya, u = tolovUI(), tl = tariflar(), oylar = L.oylar || [1, 3, 6, 12];
  if (!tl.some(t => t.k === u.tarif)) u.tarif = tl[0].k;
  const tanl = tl.find(t => t.k === u.tarif), jami = tanl.narx * u.oylar;
  const faolSon = DB.oquvchilar.filter(oquvchiFaol).length;
  const kartalar = tl.map(t => {
    const sigmaydi = t.limit && faolSon > t.limit;
    return `<button type="button" class="tarif${t.k === u.tarif ? " tanlangan" : ""}" data-act="tolov-tarif" data-k="${t.k}" aria-pressed="${t.k === u.tarif}">

      <span class="t-narx">${pulS(t.narx)}<small> / oy</small></span>
      <span class="t-shart">${t.limit ? `${t.limit} tagacha ${T.oquvchi}` : `Cheksiz ${T.oquvchilar}`}</span>
      <span class="t-shart">${t.filial ? "Bir nechta filial" : "Bitta filial"} · barcha bo‘limlar</span>
      ${sigmaydi ? `<span class="t-ogoh">Sizda ${faolSon} ta faol ${T.oquvchi} bor</span>` : ""}</button>`;
  }).join("");
  const kutish = L.kutilayotgan > 0 ? `<div class="info-quti"><span class="matn"><b>To‘lov tekshirilmoqda.</b> To‘lagan bo‘lsangiz, bir necha daqiqada obuna o‘zi yangilanadi.</span>
    <button type="button" class="btn btn-soft btn-sm" data-act="tolov-tekshir">${icon("refresh", 16)} Tekshirish</button></div>` : "";
  if (!L.tolovYoqilgan) return `<div class="tariflar">${kartalar}</div>${kutish}<p class="muted sm" style="margin:0">To‘lov uchun sotuvchiga murojaat qiling: ${esc(SOZLAMALAR.sotuvchi.nom)}${sotuvchiAloqa() ? " · " + sotuvchiAloqa() : ""}.</p>`;
  return `<div class="tariflar">${kartalar}</div>
    <div class="maydon"><span>Muddat</span><div class="seg" role="group" aria-label="Muddat">${oylar.map(n => `<button type="button" data-act="tolov-oy" data-n="${n}" aria-pressed="${n === u.oylar}">${n === 12 ? "1 yil" : n + " oy"}</button>`).join("")}</div></div>
    ${kutish}<p class="xato" id="tl-xato" hidden></p>
    <button type="button" class="btn btn-primary btn-katta" data-act="tolov-boshla" ${u.kutish ? "disabled" : ""}>${u.kutish ? "To‘lov sahifasi ochilmoqda…" : `To‘lash — ${pulS(jami)}`}</button>
    <p class="muted sm" style="margin:0;text-align:center">Click, Payme yoki Uzcard/Humo karta orqali. To‘lovdan keyin obuna avtomatik uzayadi${litsenziyaHolati().tugash && !litsenziyaHolati().tugagan ? ` (${sanaMatn(litsenziyaHolati().tugash)} dan keyin)` : ""}.</p>`;
}

      L.kutilayotgan = Math.max(1, +L.kutilayotgan || 0); Ombor.sozYoz();
      location.href = j.havola;   // TezCheck to‘lov sahifasi; to‘lovdan keyin #tolov bilan qaytadi
    } catch (e) {

// To‘lov sahifasidan qaytganda (#tolov) yoki «Tekshirish»da: to‘lov tushguncha bir necha marta so‘raydi
async function tolovKut(marta = 12) {
  const L = DB.litsenziya, oldin = L.tugash + "|" + L.tarif;
  for (let i = 0; i < marta; i++) {
    try {
      const j = await Server.sorov("tolov_tekshir", { id: L.markazId, token: L.token });
      if (j.ok) { Server.qabul(j); Server.holat = "ok"; }
    } catch (e) {}
    if (L.tugash + "|" + L.tarif !== oldin) {
      const t = tariflar().find(x => x.k === L.tarif);
      render(); toast(`To‘lov qabul qilindi! ${t ? t.nom + " tarifi, " : ""}obuna ${sanaMatn(L.tugash)} gacha`, "ok"); return true;
    }
    if (!L.kutilayotgan) break;
    if (i < marta - 1) await new Promise(r => setTimeout(r, 5000));
  }
  render();
  if (marta === 1) toast(L.kutilayotgan ? "To‘lov hali tushmagan. Bir ozdan keyin yana tekshiring." : "Kutilayotgan to‘lov yo‘q", "warn");
  return false;
}

/* ---------- «Parolni unutdim»: sotuvchi bilan chat ----------
   Xabarlar serverda (Google jadval). Sotuvchi chatga yangi parol yuborsa,
   u rahbar akkauntiga shu qurilmada o‘rnatiladi va bir marta ko‘rsatiladi. */
const CHAT = { xabarlar: [], taymer: null, yangi: null };
const direktor = () => DB.xodimlar.find(x => x.rol === "direktor" && x.faol !== false) || DB.xodimlar.find(x => x.rol === "direktor");
const vaqtMatn = ms => { const d = new Date(+ms); return `${sanaStr(d) === bugun() ? "" : sanaMatn(sanaStr(d)) + ", "}${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
function chatXabarlarHTML() {
  if (!CHAT.xabarlar.length) return `<p class="muted sm" style="margin:auto;text-align:center">Yuklanmoqda…</p>`;
  return CHAT.xabarlar.map(x => {
    const men = x.kimdan === "markaz";
    if (x.turi === "parol") {
      const y = CHAT.yangi && CHAT.yangi.id === x.id ? CHAT.yangi : null;
      return `<div class="chat-x u-ular parol-x"><b>${icon("check2", 16)} Yangi parol</b>
        ${y ? `<span>Login: <b>${esc(y.login)}</b></span><span>Parol: <b class="parol-kod">${esc(y.parol)}</b></span><span class="sm">Parol qurilmangizda o‘rnatildi. Uni yozib oling.</span>
          <button type="button" class="btn btn-primary btn-sm" data-act="chat-kirish">Kirish</button>` : `<span class="sm">Yangi parol avval yuborilgan va o‘rnatilgan.</span>`}
        <span class="chat-vaqt">${vaqtMatn(x.vaqt)}</span></div>`;
    }
    return `<div class="chat-x ${men ? "u-men" : "u-ular"}">${x.turi === "parol_sorov" ? `<b>${icon("key", 14)} Parolni unutdim</b>` : esc(x.matn)}<span class="chat-vaqt">${men ? "Siz" : esc(SOZLAMALAR.sotuvchi.nom)} · ${vaqtMatn(x.vaqt)}</span></div>`;
  }).join("");
}
function chatChiz() {
  const r = $("#chat-royxat"); if (!r) return;
  const pastda = r.scrollHeight - r.scrollTop - r.clientHeight < 40;
  r.innerHTML = chatXabarlarHTML();
  if (pastda || CHAT.yangi) r.scrollTop = r.scrollHeight;
}
async function chatQabul(l) {
  for (const x of l) {
    // Sotuvchi yuborgan yangi parol (bir marta ochiq keladi) — rahbar akkauntiga o‘rnatiladi
    if (x.kimdan === "admin" && x.turi === "parol" && x.matn && !/^•+$/.test(x.matn)) {
      const d = direktor();
      if (d) { Ombor.yoz("xodimlar", { ...d, pinXesh: await pinXesh(x.matn), faol: true }); CHAT.yangi = { id: x.id, parol: x.matn, login: d.login }; }
    }
  }
  CHAT.xabarlar = l; chatChiz();
}
async function chatYangila() {
  const L = DB.litsenziya;
  try { const j = await Server.sorov("chat_ol", { id: L.markazId, token: L.token }); if (j.ok) await chatQabul(j.xabarlar || []); }
  catch (e) {}
}
async function chatYubor(matn, turi) {
  const L = DB.litsenziya, d = direktor();
  try {
    const j = await Server.sorov("chat_yoz", { id: L.markazId, token: L.token, matn, turi, login: d ? d.login : "" });
    if (!j.ok) throw new Error(j.xato);
    await chatQabul(j.xabarlar || []);
  } catch (e) { xatoKorsat("#chat-xato", "Yuborilmadi: " + (e.name === "TypeError" ? "internet yo‘q" : e.message)); }
}
function chatTaymer(yoq) {
  clearInterval(CHAT.taymer); CHAT.taymer = null;
  if (yoq) CHAT.taymer = setInterval(() => { if (UI.kirish.tab === "yordam" && Ilova.holat === "kirish") chatYangila(); else chatTaymer(false); }, 6000);
}
Object.assign(AMALLAR, {
  "parol-unutdim": async () => {
    UI.kirish.tab = "yordam"; CHAT.xabarlar = []; CHAT.yangi = null; render();
    if (!(markazBor() && DB.litsenziya.markazId)) return;   // bu qurilmada markaz yo‘q — tushuntirish oynasi
    await chatYangila();
    // Javobsiz so‘rov yarim soat ichida yuborilgan bo‘lsa, qayta yubormaydi
    const l = CHAT.xabarlar, oxirgiAdmin = Math.max(0, ...l.filter(x => x.kimdan === "admin").map(x => +x.vaqt));
    const ochiqSorov = l.some(x => x.turi === "parol_sorov" && +x.vaqt > oxirgiAdmin && Date.now() - x.vaqt < 30 * 60000);
    if (!ochiqSorov) await chatYubor("Parolni unutdim", "parol_sorov");
    else chatChiz();
    chatTaymer(true);

  "chat-kirish": () => {
    const login = CHAT.yangi ? CHAT.yangi.login : "";
