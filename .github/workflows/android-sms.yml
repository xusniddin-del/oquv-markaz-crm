# «O‘quv Markaz SMS» telefon ilovasini yig‘ish.
# Sirlar (SMS_KEYSTORE_B64, SMS_KEYSTORE_PASS) bor bo‘lsa — imzolangan release yig‘iladi va main’da
# OquvMarkaz-SMS.apk hamda sms-version.json repo ildiziga yoziladi (GitHub Pages orqali yuklab olinadi).
# Sirlar yo‘q bo‘lsa — faqat debug yig‘iladi (kompilyatsiya tekshiruvi).
name: Android SMS ilova

on:
  push:
    paths:
      - "android-sms/**"
      - ".github/workflows/android-sms.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-sms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SMS_KEYSTORE_B64 != '' && secrets.SMS_KEYSTORE_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug yig‘ish (kompilyatsiya tekshiruvi)
        if: env.HAS_KEY != 'true'
        working-directory: android-sms
        run: gradle --no-daemon assembleDebug

      - name: Imzo kalitini tiklash
        if: env.HAS_KEY == 'true'
        env:
          SMS_KEYSTORE_B64: ${{ secrets.SMS_KEYSTORE_B64 }}
        run: echo "$SMS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oquvsms.jks"

      - name: Release yig‘ish (imzolangan)
        if: env.HAS_KEY == 'true'
        working-directory: android-sms
        env:
          SMS_KEYSTORE_FILE: ${{ runner.temp }}/oquvsms.jks
          SMS_KEYSTORE_PASS: ${{ secrets.SMS_KEYSTORE_PASS }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/OquvMarkaz-SMS.apk"
          cp version.json "$GITHUB_WORKSPACE/sms-version.json"
          rm -f "$RUNNER_TEMP/oquvsms.jks"

      - name: Natijani saqlash (Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: oquvmarkaz-sms
          path: |
            OquvMarkaz-SMS.apk
            android-sms/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Repo ildiziga yozish (faqat main)
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OquvMarkaz-SMS.apk sms-version.json
          if git diff --cached --quiet; then echo "O‘zgarish yo‘q"; exit 0; fi
          git commit -m "SMS ilova: $(python3 -c 'import json;print(json.load(open("sms-version.json"))["name"])') [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
